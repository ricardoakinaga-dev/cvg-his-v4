groups:
  - name: cvg-his-v2-slos
    rules:
      - alert: CVG_HIS_API_SLO_Availability_Alert
        expr: 100 * avg_over_time(up{job="cvg-api"}[1h]) < 99
        for: 5m
        labels:
          severity: warning
          slo: api-availability
        annotations:
          summary: 'Disponibilidade da API abaixo do alerta do SLO'
          description: 'Disponibilidade observada na janela de 1h abaixo de 99.0%, contra target de 99.5%.'

      - alert: CVG_HIS_API_SLO_Availability_Critical
        expr: 100 * avg_over_time(up{job="cvg-api"}[1h]) < 98
        for: 5m
        labels:
          severity: critical
          slo: api-availability
        annotations:
          summary: 'Disponibilidade da API abaixo do crítico do SLO'
          description: 'Disponibilidade observada na janela de 1h abaixo de 98.0%, com consumo crítico do error budget.'

      - alert: CVG_HIS_API_SLO_ErrorRate_Alert
        expr: sum(rate(http_errors_total{status_category="5xx"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.005
        for: 5m
        labels:
          severity: warning
          slo: api-error-rate
        annotations:
          summary: 'Taxa de erro 5xx acima do alerta do SLO'
          description: 'Taxa de 5xx acima de 0.5% na janela de 5m; o target operacional do SLO é 0.1%.'

      - alert: CVG_HIS_API_SLO_ErrorRate_Critical
        expr: sum(rate(http_errors_total{status_category="5xx"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: critical
          slo: api-error-rate
        annotations:
          summary: 'Taxa de erro 5xx acima do crítico do SLO'
          description: 'Taxa de 5xx acima de 1.0% na janela de 5m; error budget em consumo crítico.'

      - alert: CVG_HIS_API_SLO_P95Latency_Alert
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.25
        for: 5m
        labels:
          severity: warning
          slo: api-latency-p95
        annotations:
          summary: 'P95 da API acima do alerta do SLO'
          description: 'P95 acima de 250ms na janela de 5m; o target operacional é 200ms.'

      - alert: CVG_HIS_API_SLO_P95Latency_Critical
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.3
        for: 5m
        labels:
          severity: critical
          slo: api-latency-p95
        annotations:
          summary: 'P95 da API acima do crítico do SLO'
          description: 'P95 acima de 300ms na janela de 5m.'

      - alert: CVG_HIS_API_SLO_P99Latency_Alert
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.6
        for: 5m
        labels:
          severity: warning
          slo: api-latency-p99
        annotations:
          summary: 'P99 da API acima do alerta do SLO'
          description: 'P99 acima de 600ms na janela de 5m; o target operacional é 500ms.'

      - alert: CVG_HIS_API_SLO_P99Latency_Critical
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.8
        for: 5m
        labels:
          severity: critical
          slo: api-latency-p99
        annotations:
          summary: 'P99 da API acima do crítico do SLO'
          description: 'P99 acima de 800ms na janela de 5m.'

  - name: cvg-his-v2-operational
    rules:
      - alert: CVG_HIS_API_ForbiddenRegression
        expr: sum(rate(http_operational_outcomes_total{operation="forbidden",result="error"}[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: authorization
        annotations:
          summary: 'Aumento sustentado de respostas 403 por rota e papel'
          description: 'Use as labels route e role e o correlationId do log estruturado para distinguir negação esperada de carga secundária regressiva.'

      - alert: CVG_HIS_API_DownloadFailures
        expr: sum(rate(http_operational_outcomes_total{operation="download",result="error"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          component: downloads
        annotations:
          summary: 'Falhas em downloads auditáveis'
          description: 'Exportações de relatório ou anexos falharam; filtre route e role no painel e correlacione com os logs.'

      - alert: CVG_HIS_API_Liveness_Failing
        expr: up{job="cvg-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Liveness probe da API CVG-HIS-V2 falhando'
          description: 'O processo da API não está respondendo ao probe de liveness.'

      - alert: CVG_HIS_DB_Unhealthy
        expr: app_database_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Banco de dados da API CVG-HIS-V2 está unreachable'
          description: 'O banco de dados não está respondendo há mais de 1 minuto.'

      - alert: CVG_HIS_API_DatabasePersistenceUnavailable
        expr: app_persistence_mode{mode="unavailable"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Persistência durável da API CVG-HIS-V2 indisponível'
          description: 'O banco está indisponível; a API mantém readiness fechado e rejeita mutações duráveis até a recuperação verificada.'

      - alert: CVG_HIS_API_InMemoryMode
        expr: app_persistence_mode{mode="in-memory"} == 1 and app_uptime_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API CVG-HIS-V2 rodando em modo in-memory'
          description: 'API está em modo in-memory explícito há mais de 5 minutos; isso é permitido apenas em desenvolvimento/teste e não representa persistência de produção.'

      - alert: CVG_HIS_PIX_Settlement_ReconciliationRequired
        expr: max(worker_pix_provider_settlement_reconciliation_required) > 0
        for: 5m
        labels:
          severity: critical
          component: pix-settlement
        annotations:
          summary: 'PIX settlement exige reconciliação manual'
          description: 'Há pelo menos uma entrega PIX terminal na DLQ durável. Inspecione a fila tenant-scoped e redrive somente após validar a causa.'
          runbook: 'docs/runbooks/pix-settlement-dlq.md'

  - name: cvg-his-v2-runtime-contracts
    rules:
      - alert: CVG_HIS_API_Redis_Unhealthy
        expr: app_runtime_distributed_state_enabled == 1 and app_redis_healthy == 0
        for: 2m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: 'Redis indisponível para estado distribuído'
          description: 'O runtime distribuído está habilitado, mas a API não consegue confirmar a saúde do Redis. Readiness e rate limiting podem ser afetados.'
          runbook: 'docs/runbooks/observability-alerts.md#redis-unhealthy'

      - alert: CVG_HIS_API_DatabasePoolExhaustion
        expr: app_database_pool_waiting_count > 0 and app_database_pool_total_count >= app_database_pool_max_connections
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Pool de conexões do banco sob pressão'
          description: 'Há requisições aguardando conexão enquanto o pool está no limite configurado. Investigue lentidão, vazamentos e limites do Postgres.'
          runbook: 'docs/runbooks/observability-alerts.md#database-pool-exhaustion'

      - alert: CVG_HIS_Worker_Unavailable
        expr: up{job="cvg-worker"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Worker CVG-HIS-V2 indisponível'
          description: 'O endpoint Prometheus do worker não está sendo coletado. Jobs duráveis podem acumular backlog.'
          runbook: 'docs/runbooks/observability-alerts.md#worker-unavailable'

      - alert: CVG_HIS_Worker_ProcessingStale
        expr: time() - worker_last_successful_tick_timestamp_seconds{environment=~"production|staging|prod|stage"} > 300
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Worker sem processamento saudável recente'
          description: 'O worker está sendo coletado, mas não conclui um ciclo sem falha isolada há mais de 5 minutos.'
          runbook: 'docs/runbooks/observability-alerts.md#worker-processing-stale'

      - alert: CVG_HIS_Worker_DatabaseUnhealthy
        expr: worker_database_healthy{environment=~"production|staging|prod|stage"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Worker sem banco de dados saudável'
          description: 'O worker está ativo, mas não consegue confirmar persistência PostgreSQL saudável para processar jobs duráveis.'
          runbook: 'docs/runbooks/observability-alerts.md#worker-database-unhealthy'

      - alert: CVG_HIS_Worker_InMemoryMode
        expr: worker_persistence_mode{mode="in-memory",environment=~"production|staging|prod|stage"} == 1
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: 'Worker em modo de persistência em memória'
          description: 'O worker está executando sem repositório durável; em ambiente produtivo isso pode perder jobs e quebrar a garantia de entrega.'
          runbook: 'docs/runbooks/observability-alerts.md#worker-in-memory-mode'

      - alert: CVG_HIS_Worker_JobDeadLettered
        expr: increase(cvg_job_dead_letter_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: 'Job durável movido para DLQ'
          description: 'Um ou mais jobs clínicos excederam as tentativas e foram movidos para dead letter. Preserve a evidência e siga o runbook antes de redrive.'
          runbook: 'docs/runbooks/observability-alerts.md#worker-job-dead-lettered'
