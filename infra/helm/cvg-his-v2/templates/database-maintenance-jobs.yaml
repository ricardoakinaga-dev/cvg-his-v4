{{- if and .Values.databaseMaintenance.enabled (not .Values.postgresql.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cvg-his-v2.fullname" . }}-database-maintenance
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-maintenance
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.databaseMaintenance.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.databaseMaintenance.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-maintenance
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "cvg-his-v2.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-and-reconcile-database
          image: {{ .Values.api.image.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              node packages/db/dist/migrate.js &&
              node packages/db/dist/reconcile-runtime-roles.js
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.url }}
            - name: POSTGRES_API_USER
              value: {{ .Values.postgresql.auth.apiUsername | quote }}
            - name: POSTGRES_WORKER_USER
              value: {{ .Values.postgresql.auth.workerUsername | quote }}
{{- end }}
