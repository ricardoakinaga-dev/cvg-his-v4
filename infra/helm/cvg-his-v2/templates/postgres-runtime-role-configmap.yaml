{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cvg-his-v2.fullname" . }}-postgres-runtime-role
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
data:
  init-runtime-role.sh: |-
    #!/bin/sh
    set -eu
    validate_role_name() {
      case "$1" in
        ''|*[!A-Za-z0-9_]*) echo "Invalid PostgreSQL role name" >&2; exit 1 ;;
      esac
    }
    validate_role_name "$POSTGRES_API_USER"
    validate_role_name "$POSTGRES_WORKER_USER"
    if [ "$POSTGRES_API_USER" = "$POSTGRES_WORKER_USER" ]; then
      echo "POSTGRES_API_USER and POSTGRES_WORKER_USER must be different" >&2
      exit 1
    fi
    if [ "$POSTGRES_API_USER" = "cvg_installer" ] || [ "$POSTGRES_WORKER_USER" = "cvg_installer" ]; then
      echo "Runtime login roles cannot use the reserved cvg_installer capability name" >&2
      exit 1
    fi
    until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do sleep 1; done
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      --set=api_user="$POSTGRES_API_USER" --set=api_password="$POSTGRES_API_PASSWORD" \
      --set=worker_user="$POSTGRES_WORKER_USER" --set=worker_password="$POSTGRES_WORKER_PASSWORD" \
      --set=db_name="$POSTGRES_DB" <<'SQL'
    SELECT 'CREATE ROLE cvg_installer NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cvg_installer')\gexec
    SELECT 'CREATE ROLE cvg_api_key_auth NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS'
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cvg_api_key_auth')\gexec
    SELECT 'CREATE ROLE cvg_pix_dlq_operator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS'
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'cvg_pix_dlq_operator')\gexec
      SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD %L', :'api_user', :'api_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'api_user')\gexec
      SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD %L', :'worker_user', :'worker_password')
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'worker_user')\gexec
    ALTER ROLE cvg_installer NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    ALTER ROLE cvg_api_key_auth NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    ALTER ROLE cvg_pix_dlq_operator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
    ALTER ROLE :"api_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD :'api_password';
    ALTER ROLE :"worker_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD :'worker_password';
    SELECT format('REVOKE %I FROM %I', inherited.rolname, member.rolname)
    FROM pg_auth_members membership
    JOIN pg_roles member ON member.oid = membership.member
    JOIN pg_roles inherited ON inherited.oid = membership.roleid
    WHERE member.rolname IN (:'api_user', :'worker_user')\gexec
    GRANT cvg_installer TO :"api_user" WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
    REVOKE cvg_installer FROM :"worker_user";
    REVOKE cvg_api_key_auth FROM :"api_user", :"worker_user";
    REVOKE cvg_pix_dlq_operator FROM :"api_user", :"worker_user";
    GRANT CONNECT ON DATABASE :"db_name" TO :"api_user";
    GRANT CONNECT ON DATABASE :"db_name" TO :"worker_user";
    GRANT USAGE ON SCHEMA public TO :"api_user", :"worker_user";

    SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, :'api_user')
    FROM pg_namespace WHERE nspname = 'app'\gexec
    SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, :'worker_user')
    FROM pg_namespace WHERE nspname = 'app'\gexec
    SELECT 'GRANT USAGE ON SCHEMA app TO cvg_installer'
    WHERE EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'app')\gexec
    GRANT USAGE ON SCHEMA public TO cvg_api_key_auth;
    SELECT 'GRANT USAGE ON SCHEMA app TO cvg_api_key_auth'
    WHERE EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'app')\gexec
    SELECT 'GRANT SELECT (id, account_id, name, key_prefix, key_hash, permissions, rate_limit, rate_limit_window, expires_at, last_used_at, is_active, created_by, created_at, updated_at) ON TABLE public.api_keys TO cvg_api_key_auth'
    WHERE to_regclass('public.api_keys') IS NOT NULL\gexec
    SELECT 'GRANT SELECT (transaction_id, account_id) ON TABLE public.pix_transactions TO cvg_api_key_auth'
    WHERE to_regclass('public.pix_transactions') IS NOT NULL\gexec
    GRANT USAGE ON SCHEMA public TO cvg_pix_dlq_operator;
    SELECT 'GRANT USAGE ON SCHEMA app TO cvg_pix_dlq_operator'
    WHERE EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'app')\gexec
    SELECT 'GRANT SELECT, UPDATE ON TABLE public.pix_provider_event_deliveries TO cvg_pix_dlq_operator'
    WHERE to_regclass('public.pix_provider_event_deliveries') IS NOT NULL\gexec
    SELECT 'GRANT SELECT (id, account_id, is_active) ON TABLE public.users TO cvg_pix_dlq_operator'
    WHERE to_regclass('public.users') IS NOT NULL\gexec
    SELECT 'GRANT INSERT ON TABLE public.audit_events TO cvg_pix_dlq_operator'
    WHERE to_regclass('public.audit_events') IS NOT NULL\gexec
    SELECT 'GRANT EXECUTE ON FUNCTION app.current_account_id() TO cvg_pix_dlq_operator'
    WHERE to_regprocedure('app.current_account_id()') IS NOT NULL\gexec
    SELECT 'GRANT EXECUTE ON FUNCTION app.has_account_context() TO cvg_pix_dlq_operator'
    WHERE to_regprocedure('app.has_account_context()') IS NOT NULL\gexec

    REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM :"api_user", :"worker_user";
    REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public FROM :"api_user", :"worker_user";
    SELECT format('REVOKE ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA %I FROM %I', nspname, :'api_user')
    FROM pg_namespace WHERE nspname = 'app'\gexec
    SELECT format('REVOKE ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA %I FROM %I', nspname, :'worker_user')
    FROM pg_namespace WHERE nspname = 'app'\gexec
    SELECT format('REVOKE ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA %I FROM PUBLIC', nspname)
    FROM pg_namespace WHERE nspname = 'app'\gexec

    SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.%I TO %I', c.relname, :'api_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p') AND c.relrowsecurity\gexec
    SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.%I TO %I', c.relname, :'worker_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p') AND c.relrowsecurity\gexec

    -- Provider ingress is an append-only ledger. Runtime roles may insert
    -- rows and update workflow fields guarded by the database trigger, but
    -- cannot delete historical provider facts or truncate the ledger.
    SELECT format('REVOKE DELETE, TRUNCATE ON TABLE public.%I FROM %I', 'laboratory_result_imports', runtime_role.role_name)
    FROM (VALUES (:'api_user'), (:'worker_user')) AS runtime_role(role_name)
    WHERE to_regclass('public.laboratory_result_imports') IS NOT NULL\gexec

    SELECT format('REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON TABLE public.%I FROM %I', candidate.table_name, runtime_role.role_name)
    FROM (
      VALUES ('roles', 'INSERT'),
             ('permissions', 'INSERT'),
             ('role_permissions', 'INSERT, DELETE'),
             ('user_roles', 'INSERT, DELETE'),
             ('cfop_entries', 'INSERT, UPDATE'),
             ('icms_tables', 'INSERT, UPDATE'),
             ('ipi_tables', 'INSERT, UPDATE'),
             ('pis_tables', 'INSERT, UPDATE'),
             ('cofins_tables', 'INSERT, UPDATE'),
             ('ibs_cbs_tables', 'INSERT, UPDATE'),
             ('icms_rules', 'INSERT'),
             ('nfse_layouts', 'INSERT, UPDATE')
    ) AS candidate(table_name, privileges)
    CROSS JOIN (VALUES (:'api_user'), (:'worker_user')) AS runtime_role(role_name)
    JOIN pg_class c ON c.relname = candidate.table_name
    JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'\gexec

    SELECT format('GRANT SELECT ON TABLE public.%I TO %I', candidate.table_name, :'api_user')
    FROM (
      VALUES ('accounts'), ('tenants'), ('roles'), ('permissions'), ('role_permissions'),
             ('user_roles'), ('cfop_entries'), ('cofins_tables'), ('ibs_cbs_tables'),
             ('icms_rules'), ('icms_tables'), ('ipi_tables'), ('ncm_entries'),
             ('nfse_layouts'), ('pis_cofins_rules'), ('pis_tables')
    ) AS candidate(table_name)
    JOIN pg_class c ON c.relname = candidate.table_name
    JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'\gexec
    SELECT format('GRANT SELECT ON TABLE public.%I TO %I', candidate.table_name, :'worker_user')
    FROM (
      VALUES ('accounts'), ('tenants'), ('roles'), ('permissions'), ('role_permissions'),
             ('user_roles'), ('cfop_entries'), ('cofins_tables'), ('ibs_cbs_tables'),
             ('icms_rules'), ('icms_tables'), ('ipi_tables'), ('ncm_entries'),
             ('nfse_layouts'), ('pis_cofins_rules'), ('pis_tables')
    ) AS candidate(table_name)
    JOIN pg_class c ON c.relname = candidate.table_name
    JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'\gexec

    SELECT format('GRANT %s ON TABLE public.%I TO %I', candidate.privileges, candidate.table_name, :'api_user')
    FROM (
      VALUES ('roles', 'INSERT'),
             ('permissions', 'INSERT'),
             ('role_permissions', 'INSERT, DELETE'),
             ('user_roles', 'INSERT, DELETE'),
             ('cfop_entries', 'INSERT, UPDATE'),
             ('icms_tables', 'INSERT, UPDATE'),
             ('ipi_tables', 'INSERT, UPDATE'),
             ('pis_tables', 'INSERT, UPDATE'),
             ('cofins_tables', 'INSERT, UPDATE'),
             ('ibs_cbs_tables', 'INSERT, UPDATE'),
             ('icms_rules', 'INSERT'),
             ('nfse_layouts', 'INSERT, UPDATE')
    ) AS candidate(table_name, privileges)
    JOIN pg_class c ON c.relname = candidate.table_name
    JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'\gexec

    SELECT format('GRANT USAGE, SELECT ON SEQUENCE public.%I TO %I', c.relname, :'api_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind = 'S'\gexec
    SELECT format('GRANT USAGE, SELECT ON SEQUENCE public.%I TO %I', c.relname, :'worker_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind = 'S'\gexec

    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app' AND p.proname IN ('current_account_id', 'has_account_context')\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app' AND p.proname IN ('current_account_id', 'has_account_context')\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_encounter_cash_receipt_consistent'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, boolean'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_encounter_non_cash_receipt_consistent'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_one_active_encounter_cash_receipt'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, uuid'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_encounter_cash_receipt_consistent'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, boolean'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_encounter_non_cash_receipt_consistent'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'assert_one_active_encounter_cash_receipt'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, uuid'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO cvg_installer', p.oid::regprocedure)
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname IN ('is_initial_setup_required', 'provision_initial_installation')\gexec
    SELECT format('REVOKE ALL ON FUNCTION %s FROM PUBLIC, %I', p.oid::regprocedure, :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app' AND (
      (p.proname = 'resolve_active_api_key' AND pg_catalog.oidvectortypes(p.proargtypes) = 'text, text') OR
      (p.proname = 'is_pix_transaction_owned_by' AND pg_catalog.oidvectortypes(p.proargtypes) = 'text, uuid')
    )\gexec
    SELECT format('REVOKE ALL ON FUNCTION %s FROM %I, %I', p.oid::regprocedure, :'api_user', :'worker_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'redrive_pix_provider_event_delivery'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, uuid, uuid, text, text'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app'
      AND p.proname = 'redrive_pix_provider_event_delivery'
      AND pg_catalog.oidvectortypes(p.proargtypes) = 'uuid, uuid, uuid, text, text'\gexec
    SELECT format('GRANT EXECUTE ON FUNCTION %s TO %I', p.oid::regprocedure, :'api_user')
    FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE n.nspname = 'app' AND (
      (p.proname = 'resolve_active_api_key' AND pg_catalog.oidvectortypes(p.proargtypes) = 'text, text') OR
      (p.proname = 'is_pix_transaction_owned_by' AND pg_catalog.oidvectortypes(p.proargtypes) = 'text, uuid')
    )\gexec

    SELECT format('REVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.%I FROM %I', c.relname, :'api_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relname = 'audit_events'\gexec
    SELECT format('REVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.%I FROM %I', c.relname, :'worker_user')
    FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relname = 'audit_events'\gexec

    # Authentication state is API-owned. Reapply the narrower boundary after
    # broad RLS grants so a repeated Helm bootstrap cannot widen worker access.
    SELECT format('REVOKE ALL PRIVILEGES ON TABLE public.%I FROM %I', candidate.table_name, runtime_role.role_name)
    FROM (
      VALUES ('users'), ('account_service_principals'), ('sessions'),
             ('mfa_credentials'), ('auth_mfa_login_challenges'),
             ('auth_webauthn_credentials'), ('auth_webauthn_challenges'),
             ('api_keys'), ('api_key_usage'), ('api_key_rate_limits')
    ) AS candidate(table_name)
    CROSS JOIN (VALUES (:'api_user'), (:'worker_user')) AS runtime_role(role_name)
    WHERE to_regclass(format('public.%I', candidate.table_name)) IS NOT NULL\gexec

    SELECT format('GRANT %s ON TABLE public.%I TO %I', candidate.privileges, candidate.table_name, :'api_user')
    FROM (
      VALUES ('users', 'SELECT, INSERT, UPDATE'),
             ('sessions', 'SELECT, INSERT, UPDATE, DELETE'),
             ('mfa_credentials', 'SELECT, INSERT, UPDATE, DELETE'),
             ('auth_mfa_login_challenges', 'SELECT, INSERT, UPDATE'),
             ('auth_webauthn_credentials', 'SELECT, INSERT, UPDATE, DELETE'),
             ('auth_webauthn_challenges', 'SELECT, INSERT, UPDATE'),
             ('api_keys', 'SELECT, INSERT, UPDATE, DELETE'),
             ('api_key_usage', 'SELECT, INSERT'),
             ('api_key_rate_limits', 'SELECT, INSERT, UPDATE')
    ) AS candidate(table_name, privileges)
    WHERE to_regclass(format('public.%I', candidate.table_name)) IS NOT NULL\gexec

    SELECT format('GRANT SELECT ON TABLE public.account_service_principals TO %I', :'worker_user')
    WHERE to_regclass('public.account_service_principals') IS NOT NULL\gexec
    SELECT format(
      'GRANT SELECT (id, account_id, is_active, principal_kind, interactive_login_enabled) ON TABLE public.users TO %I',
      :'worker_user'
    )
    WHERE to_regclass('public.users') IS NOT NULL
      AND EXISTS (
        SELECT 1 FROM pg_attribute
        WHERE attrelid = to_regclass('public.users')
          AND attname IN ('principal_kind', 'interactive_login_enabled')
        GROUP BY attrelid HAVING count(*) = 2
      )\gexec

    SELECT format('REVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.pix_provider_events FROM %I', :'api_user')
    WHERE to_regclass('public.pix_provider_events') IS NOT NULL\gexec
    SELECT format('REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON TABLE public.pix_provider_events FROM %I', :'worker_user')
    WHERE to_regclass('public.pix_provider_events') IS NOT NULL\gexec
    SELECT format('REVOKE UPDATE, DELETE, TRUNCATE ON TABLE public.pix_provider_event_deliveries FROM %I', :'api_user')
    WHERE to_regclass('public.pix_provider_event_deliveries') IS NOT NULL\gexec
    SELECT format('REVOKE INSERT, DELETE, TRUNCATE ON TABLE public.pix_provider_event_deliveries FROM %I', :'worker_user')
    WHERE to_regclass('public.pix_provider_event_deliveries') IS NOT NULL\gexec
    SELECT format('GRANT SELECT, INSERT ON TABLE public.pix_provider_events TO %I', :'api_user')
    WHERE to_regclass('public.pix_provider_events') IS NOT NULL\gexec
    SELECT format('GRANT SELECT ON TABLE public.pix_provider_events TO %I', :'worker_user')
    WHERE to_regclass('public.pix_provider_events') IS NOT NULL\gexec
    SELECT format('GRANT SELECT, INSERT ON TABLE public.pix_provider_event_deliveries TO %I', :'api_user')
    WHERE to_regclass('public.pix_provider_event_deliveries') IS NOT NULL\gexec
    SELECT format('GRANT SELECT, UPDATE ON TABLE public.pix_provider_event_deliveries TO %I', :'worker_user')
    WHERE to_regclass('public.pix_provider_event_deliveries') IS NOT NULL\gexec

    ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON TABLES FROM :"api_user", :"worker_user";
    ALTER DEFAULT PRIVILEGES IN SCHEMA public REVOKE ALL ON SEQUENCES FROM :"api_user", :"worker_user";
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    SQL
{{- end }}
