{{- /*
Optional local attachment storage for the API. Multi-replica installations
must use an operator-provided storage class that supports ReadWriteMany.
*/ -}}
{{- if and .Values.persistence.enabled (not .Values.api.attachmentStorage.existingSecret) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cvg-his-v2.fullname" . }}-storage
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
