{{- /*
API Deployment + Service
*/ -}}
{{- include "cvg-his-v2.api.vault.validate" . -}}
{{- if and (not .Values.api.attachmentStorage.existingSecret) (gt (int .Values.api.replicaCount) 1) -}}
{{- if not .Values.persistence.enabled -}}
{{- fail "api.replicaCount > 1 without S3 attachment storage requires persistence.enabled=true; per-replica emptyDir storage is not safe for HA" -}}
{{- else if or (ne .Values.persistence.accessMode "ReadWriteMany") (empty .Values.persistence.storageClass) -}}
{{- fail "api.replicaCount > 1 with local attachment storage requires persistence.accessMode=ReadWriteMany and an operator-provided RWX storageClass; prefer S3-compatible attachmentStorage for HA" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cvg-his-v2.api.fullname" . }}
  labels:
    {{- include "cvg-his-v2.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cvg-his-v2.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.api.selectorLabels" . | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cvg-his-v2.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.databaseMaintenance.enabled .Values.postgresql.enabled }}
      initContainers:
        {{- include "cvg-his-v2.databaseMaintenance.initContainers" . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "cvg-his-v2.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cvg-his-v2.api.configmapName" . }}
          env:
            - name: DATABASE_REQUIRE_RLS_ROLE
              value: "1"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.secretName" . }}
                  key: {{ .Values.api.auth.secretKey }}
            {{- if .Values.api.metrics.existingSecret }}
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.metrics.existingSecret }}
                  key: {{ .Values.api.metrics.secretKey }}
                  optional: false
            {{- end }}
            {{- if or .Values.api.setup.existingSecret .Values.api.setup.value }}
            - name: SETUP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.setupSecretName" . }}
                  key: {{ .Values.api.setup.secretKey }}
                  optional: true
            {{- end }}
            # DATABASE_URL injected via secretRef
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.apiUrl }}
            {{- if eq (include "cvg-his-v2.api.vault.enabled" .) "true" }}
            - name: VAULT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.vault.secretName" . }}
                  key: {{ .Values.api.vault.secretKeys.url }}
                  optional: false
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.vault.secretName" . }}
                  key: {{ .Values.api.vault.secretKeys.roleId }}
                  optional: false
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.vault.secretName" . }}
                  key: {{ .Values.api.vault.secretKeys.secretId }}
                  optional: false
            - name: VAULT_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.vault.secretName" . }}
                  key: {{ .Values.api.vault.secretKeys.namespace }}
                  optional: true
            - name: VAULT_SECRET_PATH_PREFIX
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.vault.secretName" . }}
                  key: {{ .Values.api.vault.secretKeys.path }}
                  optional: true
            {{- end }}
            {{- if .Values.api.attachmentStorage.existingSecret }}
            - name: ATTACHMENT_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentStorage.existingSecret }}
                  key: {{ .Values.api.attachmentStorage.secretKeys.endpoint }}
            - name: ATTACHMENT_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentStorage.existingSecret }}
                  key: {{ .Values.api.attachmentStorage.secretKeys.bucket }}
            - name: ATTACHMENT_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentStorage.existingSecret }}
                  key: {{ .Values.api.attachmentStorage.secretKeys.accessKey }}
            - name: ATTACHMENT_STORAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentStorage.existingSecret }}
                  key: {{ .Values.api.attachmentStorage.secretKeys.secretKey }}
            {{- end }}
            {{- if .Values.api.attachmentScanner.existingSecret }}
            - name: ATTACHMENT_SCANNER_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentScanner.existingSecret }}
                  key: {{ .Values.api.attachmentScanner.secretKeys.host }}
            - name: ATTACHMENT_SCANNER_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentScanner.existingSecret }}
                  key: {{ .Values.api.attachmentScanner.secretKeys.port }}
                  optional: true
            - name: ATTACHMENT_SCANNER_TIMEOUT_MS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.attachmentScanner.existingSecret }}
                  key: {{ .Values.api.attachmentScanner.secretKeys.timeoutMs }}
                  optional: true
            {{- end }}
            {{- if or .Values.redis.enabled .Values.redis.url .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.redis.secretName" . }}
                  key: {{ .Values.redis.secretKeys.url }}
            {{- end }}
          {{- if .Values.api.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.livenessPath | default "/live" }}
              port: http
            initialDelaySeconds: {{ .Values.api.probes.livenessDelay }}
            periodSeconds: {{ .Values.api.probes.livenessPeriod }}
            failureThreshold: {{ .Values.api.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readinessPath | default "/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readinessDelay }}
            periodSeconds: {{ .Values.api.probes.readinessPeriod }}
            failureThreshold: {{ .Values.api.probes.readinessFailureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startupPath | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.api.probes.startupDelay }}
            periodSeconds: {{ .Values.api.probes.startupPeriod }}
            failureThreshold: {{ .Values.api.probes.startupFailureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if not .Values.api.attachmentStorage.existingSecret }}
          volumeMounts:
            - name: storage
              mountPath: /srv/cvg-his-v2/storage
          {{- end }}
      {{- if not .Values.api.attachmentStorage.existingSecret }}
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cvg-his-v2.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cvg-his-v2.api.fullname" . }}
  labels:
    {{- include "cvg-his-v2.api.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cvg-his-v2.api.selectorLabels" . | nindent 4 }}
