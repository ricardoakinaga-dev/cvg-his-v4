{{- /*
API Deployment + Service
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cvg-his-v2.api.fullname" . }}
  labels:
    {{- include "cvg-his-v2.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cvg-his-v2.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.api.image.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | quote }}
            - name: HOST
              value: {{ .Values.api.env.HOST | quote }}
            - name: PORT
              value: {{ .Values.api.env.PORT | quote }}
            - name: APP_NAME
              value: {{ .Values.api.env.APP_NAME | quote }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.api.secretName" . }}
                  key: {{ .Values.api.auth.secretKey }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.api.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: AUTH_ACCESS_TOKEN_TTL_SECONDS
              value: {{ .Values.api.env.AUTH_ACCESS_TOKEN_TTL_SECONDS | quote }}
            - name: AUTH_REFRESH_TOKEN_TTL_SECONDS
              value: {{ .Values.api.env.AUTH_REFRESH_TOKEN_TTL_SECONDS | quote }}
            - name: FILE_STORAGE_PATH
              value: {{ .Values.api.env.FILE_STORAGE_PATH | quote }}
            - name: RUNTIME_DISTRIBUTED_STATE_ENABLED
              value: {{ .Values.api.env.RUNTIME_DISTRIBUTED_STATE_ENABLED | quote }}
            - name: VAULT_ENABLED
              value: {{ .Values.api.env.VAULT_ENABLED | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.api.env.OTEL_ENABLED | quote }}
            # DATABASE_URL injected via secretRef
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.url }}
            {{- if or .Values.redis.enabled .Values.redis.url .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.redis.secretName" . }}
                  key: {{ .Values.redis.secretKeys.url }}
            {{- end }}
          {{- if .Values.api.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.probes.livenessDelay }}
            periodSeconds: {{ .Values.api.probes.livenessPeriod }}
            failureThreshold: {{ .Values.api.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readinessDelay }}
            periodSeconds: {{ .Values.api.probes.readinessPeriod }}
            failureThreshold: {{ .Values.api.probes.readinessFailureThreshold }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.probes.startupDelay }}
            periodSeconds: {{ .Values.api.probes.startupPeriod }}
            failureThreshold: {{ .Values.api.probes.startupFailureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /srv/cvg-his-v2/storage
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cvg-his-v2.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cvg-his-v2.api.fullname" . }}
  labels:
    {{- include "cvg-his-v2.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cvg-his-v2.api.selectorLabels" . | nindent 4 }}
