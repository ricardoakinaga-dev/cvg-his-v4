{{- /*
Worker Deployment (no Service — runs as singleton process loop)
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cvg-his-v2.worker.fullname" . }}
  labels:
    {{- include "cvg-his-v2.worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.worker.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cvg-his-v2.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.worker.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ .Values.worker.image.registry }}/{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: {{ .Values.worker.env.NODE_ENV | quote }}
            - name: APP_NAME
              value: {{ .Values.worker.env.APP_NAME | quote }}
            - name: WORKER_INTERVAL_MS
              value: {{ .Values.worker.env.WORKER_INTERVAL_MS | quote }}
            - name: OTEL_ENABLED
              value: {{ .Values.worker.env.OTEL_ENABLED | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.url }}
          {{- if .Values.worker.probes.enabled }}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(0)"
            initialDelaySeconds: {{ .Values.worker.probes.livenessDelay }}
            periodSeconds: {{ .Values.worker.probes.livenessPeriod }}
            failureThreshold: {{ .Values.worker.probes.livenessFailureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /srv/cvg-his-v2/storage
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cvg-his-v2.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
