{{- /*
Worker Deployment (no Service — runs as singleton process loop)
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cvg-his-v2.worker.fullname" . }}
  labels:
    {{- include "cvg-his-v2.worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.worker.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.worker.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "cvg-his-v2.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.worker.selectorLabels" . | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cvg-his-v2.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deploymentDefaults.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.databaseMaintenance.enabled .Values.postgresql.enabled }}
      initContainers:
        {{- include "cvg-his-v2.databaseMaintenance.initContainers" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.worker.image.registry }}/{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: http-health
              containerPort: {{ .Values.worker.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cvg-his-v2.worker.configmapName" . }}
          env:
            - name: DATABASE_REQUIRE_RLS_ROLE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.workerUrl }}
            {{- if .Values.worker.accountIds.existingSecret }}
            - name: WORKER_ACCOUNT_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.worker.accountIdsSecretName" . }}
                  key: {{ .Values.worker.accountIds.secretKey }}
                  optional: false
            {{- else if .Values.worker.env.WORKER_ACCOUNT_IDS }}
            - name: WORKER_ACCOUNT_IDS
              value: {{ .Values.worker.env.WORKER_ACCOUNT_IDS | quote }}
            {{- end }}
          {{- if .Values.worker.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.livenessPath | default "/live" }}
              port: http-health
            initialDelaySeconds: {{ .Values.worker.probes.livenessDelay }}
            periodSeconds: {{ .Values.worker.probes.livenessPeriod }}
            failureThreshold: {{ .Values.worker.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readinessPath | default "/ready" }}
              port: http-health
            initialDelaySeconds: {{ .Values.worker.probes.readinessDelay }}
            periodSeconds: {{ .Values.worker.probes.readinessPeriod }}
            failureThreshold: {{ .Values.worker.probes.readinessFailureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.worker.probes.startupPath | default "/health" }}
              port: http-health
            initialDelaySeconds: {{ .Values.worker.probes.startupDelay }}
            periodSeconds: {{ .Values.worker.probes.startupPeriod }}
            failureThreshold: {{ .Values.worker.probes.startupFailureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /srv/cvg-his-v2/storage
      volumes:
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cvg-his-v2.fullname" . }}-storage
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cvg-his-v2.worker.fullname" . }}
  labels:
    {{- include "cvg-his-v2.worker.labels" . | nindent 4 }}
  {{- with .Values.worker.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.worker.service.type }}
  ports:
    - port: {{ .Values.worker.service.port }}
      targetPort: http-health
      protocol: TCP
      name: http-health
  selector:
    {{- include "cvg-his-v2.worker.selectorLabels" . | nindent 4 }}
