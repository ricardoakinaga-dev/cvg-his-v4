{{- /*
PostgreSQL StatefulSet — enabled only when .Values.postgresql.enabled
Production should use external PostgreSQL (RDS, Cloud SQL)
*/ -}}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cvg-his-v2.fullname" . }}-postgres
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "cvg-his-v2.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "cvg-his-v2.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "cvg-his-v2.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_API_USER
              value: {{ .Values.postgresql.auth.apiUsername | quote }}
            - name: POSTGRES_WORKER_USER
              value: {{ .Values.postgresql.auth.workerUsername | quote }}
            - name: POSTGRES_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.apiPassword }}
            - name: POSTGRES_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2.postgres.secretName" . }}
                  key: {{ .Values.postgresql.secretKeys.workerPassword }}
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "/usr/local/bin/init-runtime-role.sh"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime-role-script
              mountPath: /usr/local/bin/init-runtime-role.sh
              subPath: init-runtime-role.sh
      volumes:
        - name: runtime-role-script
          configMap:
            name: {{ include "cvg-his-v2.fullname" . }}-postgres-runtime-role
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.postgresql.persistence.accessMode | default "ReadWriteOnce" }}]
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
