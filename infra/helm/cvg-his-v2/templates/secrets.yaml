{{- /*
Secrets — stores DATABASE_URL, REDIS_URL, AUTH_SECRET, etc.
NEVER put real secrets in shared values files — prefer existingSecret for staging/prod.
*/ -}}
{{- if and (not .Values.api.auth.existingSecret) .Values.api.auth.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvg-his-v2.api.secretName" . }}
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.auth.secretKey }}: {{ .Values.api.auth.value | quote }}
---
{{- end }}
{{- if and (not .Values.postgresql.existingSecret) (or .Values.postgresql.url .Values.postgresql.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvg-his-v2.postgres.secretName" . }}
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.secretKeys.url }}: {{ default (printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.username .Values.postgresql.password (include "cvg-his-v2.fullname" .) .Values.postgresql.auth.database) .Values.postgresql.url | quote }}
  {{ .Values.postgresql.secretKeys.apiUrl }}: {{ default (printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.apiUsername (default .Values.postgresql.password .Values.postgresql.apiPassword) (include "cvg-his-v2.fullname" .) .Values.postgresql.auth.database) .Values.postgresql.apiUrl | quote }}
  {{ .Values.postgresql.secretKeys.workerUrl }}: {{ default (printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.auth.workerUsername (default .Values.postgresql.password .Values.postgresql.workerPassword) (include "cvg-his-v2.fullname" .) .Values.postgresql.auth.database) .Values.postgresql.workerUrl | quote }}
  {{ .Values.postgresql.secretKeys.password }}: {{ required "postgresql.password is required when postgresql.existingSecret is empty" .Values.postgresql.password | quote }}
  {{ .Values.postgresql.secretKeys.apiPassword }}: {{ default .Values.postgresql.password .Values.postgresql.apiPassword | quote }}
  {{ .Values.postgresql.secretKeys.workerPassword }}: {{ default .Values.postgresql.password .Values.postgresql.workerPassword | quote }}
---
{{- end }}
{{- if and (not .Values.redis.existingSecret) (or .Values.redis.enabled .Values.redis.url) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvg-his-v2.redis.secretName" . }}
  labels:
    {{- include "cvg-his-v2.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.secretKeys.url }}: {{ default (printf "redis://%s-redis:6379" (include "cvg-his-v2.fullname" .)) .Values.redis.url | quote }}
{{- end }}
