# values.staging.yaml — Staging environment overrides
global:
  environment: staging

api:
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    pullPolicy: Always
    tag: ""   # use git-sha tag from CI
  probes:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    NODE_ENV: production
    CORS_ALLOWED_ORIGINS: "https://staging.cvg-his-v2.com"
    RUNTIME_DISTRIBUTED_STATE_ENABLED: "true"
    VAULT_ENABLED: "false"
  # Staging currently uses the existing API Secret/env contract. Keeping the
  # Vault binding empty is intentional while VAULT_ENABLED remains false.
  vault:
    existingSecret: ""
  auth:
    existingSecret: cvg-his-v2-staging-api-secrets
  metrics:
    existingSecret: cvg-his-v2-staging-api-secrets
    secretKey: METRICS_AUTH_TOKEN
  setup:
    existingSecret: cvg-his-v2-staging-api-secrets
  attachmentStorage:
    existingSecret: cvg-his-v2-staging-attachment-storage
  attachmentScanner:
    existingSecret: cvg-his-v2-staging-attachment-scanner

worker:
  replicaCount: 1
  revisionHistoryLimit: 3
  image:
    pullPolicy: Always
  accountIds:
    existingSecret: cvg-his-v2-staging-worker-secrets
    secretKey: WORKER_ACCOUNT_IDS
  reportsUser:
    existingSecret: cvg-his-v2-staging-worker-secrets
    secretKey: WORKER_REPORTS_USER_ID
  env:
    NODE_ENV: staging

spa:
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    pullPolicy: Always
postgresql:
  enabled: false   # staging uses external PostgreSQL
  existingSecret: cvg-his-v2-staging-postgres

redis:
  enabled: false   # staging uses external Redis
  existingSecret: cvg-his-v2-staging-redis

# Attachments use the configured S3-compatible backend. Do not provision or
# mount a node-local/RWO filesystem across API replicas.
persistence:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "35m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { return 404; }
      location = /internal/metrics { return 404; }
      location = /slos { return 404; }
      location = /health/slos { return 404; }
  hosts:
    - host: api.staging.cvg-his-v2.com
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 3001
    - host: staging.cvg-his-v2.com
      paths:
        - path: /
          pathType: Prefix
          service: spa
          port: 3002
  tls:
    - hosts:
        - api.staging.cvg-his-v2.com
        - staging.cvg-his-v2.com
      secretName: cvg-his-v2-staging-tls

podDisruptionBudget:
  api:
    minAvailable: 1
  worker:
    minAvailable: 1
  spa:
    minAvailable: 1
