# values.prod.yaml — Production environment overrides
global:
  environment: production

api:
  replicaCount: 3
  revisionHistoryLimit: 10
  image:
    registry: ghcr.io
    repository: ricardoakinaga-dev/cvg-his-v4-api
    pullPolicy: Always
    tag: ""   # CI may use this only for publication; deploys must set sha
    sha: ""   # release authority injects the immutable manifest digest
  probes:
    enabled: true
    livenessDelay: 10
    livenessPeriod: 10
    livenessFailureThreshold: 3
    readinessDelay: 5
    readinessPeriod: 5
    readinessFailureThreshold: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  env:
    NODE_ENV: production
    CORS_ALLOWED_ORIGINS: "https://cvg-his-v2.com"
    RUNTIME_DISTRIBUTED_STATE_ENABLED: "true"
    VAULT_ENABLED: "true"
  auth:
    existingSecret: cvg-his-v2-prod-api-secrets
  metrics:
    existingSecret: cvg-his-v2-prod-api-secrets
    secretKey: METRICS_AUTH_TOKEN
  setup:
    existingSecret: cvg-his-v2-prod-api-secrets
  vault:
    existingSecret: cvg-his-v2-prod-vault
    secretKeys:
      url: VAULT_URL
      roleId: VAULT_ROLE_ID
      secretId: VAULT_SECRET_ID
      namespace: VAULT_NAMESPACE
      path: VAULT_SECRET_PATH_PREFIX
  attachmentStorage:
    existingSecret: cvg-his-v2-prod-attachment-storage
  attachmentScanner:
    existingSecret: cvg-his-v2-prod-attachment-scanner

worker:
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    registry: ghcr.io
    repository: ricardoakinaga-dev/cvg-his-v4-worker
    pullPolicy: Always
    tag: ""
    sha: ""   # release authority injects the immutable manifest digest
  accountIds:
    existingSecret: cvg-his-v2-prod-worker-secrets
    secretKey: WORKER_ACCOUNT_IDS
  reportsUser:
    existingSecret: cvg-his-v2-prod-worker-secrets
    secretKey: WORKER_REPORTS_USER_ID
  env:
    NODE_ENV: production

spa:
  replicaCount: 3
  revisionHistoryLimit: 10
  image:
    registry: ghcr.io
    repository: ricardoakinaga-dev/cvg-his-v4-spa
    pullPolicy: Always
    tag: ""
    sha: ""   # release authority injects the immutable manifest digest
postgresql:
  enabled: false   # prod uses RDS / Cloud SQL
  existingSecret: cvg-his-v2-prod-postgres
  secretKeys:
    apiUrl: api-url
    workerUrl: worker-url
    password: password

redis:
  enabled: false   # prod uses ElastiCache / Memorystore
  existingSecret: cvg-his-v2-prod-redis

# Production attachments use the configured S3-compatible backend. Keeping
# this disabled avoids coupling the HA API topology to a shared filesystem.
persistence:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "35m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "512k"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { return 404; }
      location = /internal/metrics { return 404; }
      location = /slos { return 404; }
      location = /health/slos { return 404; }
  hosts:
    - host: api.cvg-his-v2.com
      paths:
        - path: /
          pathType: Prefix
          service: api
          port: 3001
    - host: cvg-his-v2.com
      paths:
        - path: /
          pathType: Prefix
          service: spa
          port: 3002
  tls:
    - hosts:
        - api.cvg-his-v2.com
        - cvg-his-v2.com
      secretName: cvg-his-v2-prod-tls

podDisruptionBudget:
  api:
    minAvailable: 2
  worker:
    minAvailable: 1
  spa:
    minAvailable: 2

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
