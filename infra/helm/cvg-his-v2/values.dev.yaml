# values.dev.yaml — Development environment overrides
api:
  replicaCount: 1
  revisionHistoryLimit: 2
  image:
    pullPolicy: Always
  probes:
    enabled: false   # skip probes for fast restarts in dev
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: development
    CORS_ALLOWED_ORIGINS: "*"
    RUNTIME_DISTRIBUTED_STATE_ENABLED: "false"
    VAULT_ENABLED: "false"
  auth:
    existingSecret: cvg-his-v2-dev-api-secrets
    value: ""

worker:
  replicaCount: 1
  revisionHistoryLimit: 2
  image:
    pullPolicy: Always
  probes:
    enabled: true
  env:
    NODE_ENV: development

spa:
  replicaCount: 1
  revisionHistoryLimit: 2
  image:
    pullPolicy: Always

postgresql:
  enabled: true
  existingSecret: cvg-his-v2-dev-postgres
  password: ""
  adminUrl: ""
  runtimeUrl: ""
  persistence:
    enabled: true
    size: 1Gi

redis:
  enabled: true
  existingSecret: cvg-his-v2-dev-redis
  url: ""

ingress:
  enabled: false   # no ingress in dev — use port-forward instead

podDisruptionBudget:
  api:
    minAvailable: 1
  worker:
    minAvailable: 1
  spa:
    minAvailable: 1
