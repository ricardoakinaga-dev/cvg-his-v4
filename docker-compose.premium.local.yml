# Local Premium runtime overlay.
#
# This file only changes image tags and loopback port bindings. Secrets remain
# supplied through the environment variables required by docker-compose.v2.yml.
# Start with:
#   docker compose -p cvg-his-v4-premium -f docker-compose.v2.yml -f docker-compose.premium.local.yml up -d

services:
  postgres:
    ports: !override
      - '127.0.0.1:55436:5432'

  redis:
    ports: !override
      - '127.0.0.1:56381:6379'

  cvg-his-v2-api:
    image: cvg-his-api:enterprise-final
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3302,http://127.0.0.1:3302,http://localhost:5173,http://127.0.0.1:5173}
    ports: !override
      - '127.0.0.1:3303:3001'

  cvg-his-v2-worker:
    image: cvg-his-worker:enterprise-final

  cvg-his-v2-spa:
    image: cvg-his-spa:enterprise-final
    ports: !override
      - '127.0.0.1:3302:3002'
