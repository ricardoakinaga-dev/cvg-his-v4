# docker-compose.v2.yml — CVG-HIS V2 canonical stack
#
# FRONTEND CANONICO: cvg-his-v2-spa (apps/spa)
#   his.centroveterinarioguarapiranga.com -> cvg-his-v2-spa:3002
#
# REGRA OPERACIONAL:
#   O dominio principal serve cvg-his-v2-spa, NAO cvg-his-v2-web.
#   cvg-his-v2-web e um frontend legado na porta 3004, isolado em profile legacy.
#   Ele nao sobe por padrao e nao entra no fluxo canonico.
#
# Portas:
#   SPA:     3002:3002  — frontend canonico (apps/spa)
#   API:     3003:3001  — API do sistema
#   Web:     3004:3000  — portal legado (apps/web) — fora do fluxo canonico
#   Worker:  sem porta publicada
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvg_his_v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '5432:5432'
    volumes:
      - cvg_his_v2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cvg_his_v2}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - cvg_his_v2_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  cvg-his-v2-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cvg-his-v2-cvg-his-v2-api:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3001
      APP_NAME: cvg-his-v2-api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002,http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cvg_his_v2}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      FILE_STORAGE_PATH: /srv/cvg-his-v2/storage
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cvg_his_v2_storage:/srv/cvg-his-v2/storage
    ports:
      - '3003:3001'

  cvg-his-v2-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: cvg-his-v2-cvg-his-v2-web:035e555
    profiles: ['legacy']
    # Nao usar como runtime padrao; mantido apenas para fallback historico.
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      APP_NAME: cvg-his-v2-web
      API_BASE_URL: http://cvg-his-v2-api:3001
    depends_on:
      cvg-his-v2-api:
        condition: service_healthy
    ports:
      - '3004:3000'

  cvg-his-v2-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: cvg-his-v2-cvg-his-v2-worker:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_NAME: cvg-his-v2-worker
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cvg_his_v2}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      cvg-his-v2-api:
        condition: service_healthy
    volumes:
      - cvg_his_v2_storage:/srv/cvg-his-v2/storage

  cvg-his-v2-spa:
    build:
      context: .
      dockerfile: apps/spa/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-CVG HIS V2}
        VITE_DISABLE_PWA: ${VITE_DISABLE_PWA:-1}
    image: cvg-his-v2-cvg-his-v2-spa:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      cvg-his-v2-api:
        condition: service_healthy
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  cvg_his_v2_postgres_data:
  cvg_his_v2_redis_data:
  cvg_his_v2_storage:

networks:
  default:
    name: cvg-his-v2-real_net
