# docker-compose.v2.yml — CVG-HIS V2 canonical stack
#
# FRONTEND CANONICO: cvg-his-v2-spa (apps/spa)
#   his.centroveterinarioguarapiranga.com -> cvg-his-v2-spa:3002
#
# Portas:
#   SPA:     3002:3002  — frontend canonico (apps/spa)
#   API:     3003:3001  — API do sistema
#   Worker:  sem porta publicada
#   OTEL:    4318:4318  — collector OTLP HTTP (profile observability)
#   Prom:    9090:9090  — Prometheus (profile observability)
#   Grafana: 3005:3000  — Grafana (profile observability)
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cvg_his_v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-cvg_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-cvg_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-cvg_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}}
    ports:
      - '5432:5432'
    volumes:
      - cvg_his_v2_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/20-runtime-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cvg_his_v2}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - cvg_his_v2_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  runtime-role-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-cvg_his_v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-cvg_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-cvg_api}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-cvg_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/init-runtime-role.sh:/usr/local/bin/init-runtime-role.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/init-runtime-role.sh']

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.1
    profiles: ['observability']
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '4318:4318'

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.1.4
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - '3005:3000'

  cvg-his-v2-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cvg-his-v2-cvg-his-v2-api:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3001
      APP_NAME: cvg-his-v2-api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002,http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: postgres://${POSTGRES_API_USER:-cvg_api}:${POSTGRES_API_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD}}@postgres:5432/${POSTGRES_DB:-cvg_his_v2}
      DATABASE_REQUIRE_RLS_ROLE: '1'
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET is required}
      FILE_STORAGE_PATH: /srv/cvg-his-v2/storage
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-604800}
      PIX_MOCK_MODE: ${PIX_MOCK_MODE:-false}
      PAGARME_API_KEY: ${PAGARME_API_KEY:-}
      PAGARME_PIX_KEY: ${PAGARME_PIX_KEY:-}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cvg-his-v2-api}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      runtime-role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false
    volumes:
      - cvg_his_v2_storage:/srv/cvg-his-v2/storage
    ports:
      - '3003:3001'

  cvg-his-v2-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: cvg-his-v2-cvg-his-v2-worker:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_NAME: cvg-his-v2-worker
      DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-cvg_worker}:${POSTGRES_WORKER_PASSWORD:-${POSTGRES_RUNTIME_PASSWORD}}@postgres:5432/${POSTGRES_DB:-cvg_his_v2}
      DATABASE_REQUIRE_RLS_ROLE: '1'
      WORKER_ACCOUNT_IDS: ${WORKER_ACCOUNT_IDS:?WORKER_ACCOUNT_IDS is required}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${WORKER_OTEL_SERVICE_NAME:-cvg-his-v2-worker}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      runtime-role-init:
        condition: service_completed_successfully
      cvg-his-v2-api:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false
    volumes:
      - cvg_his_v2_storage:/srv/cvg-his-v2/storage

  cvg-his-v2-spa:
    build:
      context: .
      dockerfile: apps/spa/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-CVG HIS V2}
        VITE_DISABLE_PWA: ${VITE_DISABLE_PWA:-1}
    image: cvg-his-v2-cvg-his-v2-spa:035e555
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      cvg-his-v2-api:
        condition: service_healthy
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  cvg_his_v2_postgres_data:
  cvg_his_v2_redis_data:
  cvg_his_v2_storage:

networks:
  default:
    name: cvg-his-v2-real_net
