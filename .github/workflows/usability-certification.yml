name: Usability Certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase 40-character SHA to certify
        required: true
        type: string
      manual_evidence_json:
        description: Completed JSON following docs/templates/usability-certification-manual-evidence.template.json
        required: true
        type: string
      go_no_go_decision:
        description: Decision recorded after technical and manual gates
        required: true
        type: choice
        options: [go, no-go]

permissions:
  contents: read

jobs:
  technical-certification:
    name: Full certification run ${{ matrix.run }} of 3
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      E2E_ENVIRONMENT: certification-postgresql-run-${{ matrix.run }}
      E2E_EVIDENCE_RUN_ID: certification-${{ matrix.run }}
      E2E_AUDIT_COMMAND: bash infra/scripts/run-e2e-spa.sh
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        id: candidate
        run: |
          node -e 'const value=process.env.CANDIDATE_SHA; if(!/^[0-9a-f]{40}$/.test(value)){throw new Error("candidate_sha must be a lowercase full SHA")}'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Resolve pnpm store
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - name: Cache Chromium 1.58.2
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.58.2-chromium

      - run: npx playwright install --with-deps chromium

      - name: Execute full database-backed suite
        run: GITHUB_SHA="$CANDIDATE_SHA" bash infra/scripts/run-e2e-spa.sh

      - name: Validate complete run evidence
        if: always()
        run: >-
          GITHUB_SHA="$CANDIDATE_SHA" node scripts/validate-usability-playwright-evidence.mjs
          "artifacts/playwright/${CANDIDATE_SHA}/certification-${{ matrix.run }}/results.json"
          "artifacts/playwright/${CANDIDATE_SHA}/certification-${{ matrix.run }}/master-usability-audit.json"
          "artifacts/playwright/${CANDIDATE_SHA}/certification-${{ matrix.run }}/usability-test-inventory.json"
          "artifacts/playwright/${CANDIDATE_SHA}/certification-${{ matrix.run }}/playwright-discovery.json"

      - name: Record certification metadata
        if: always()
        run: |
          mkdir -p certification
          node -e 'const fs=require("fs"); fs.writeFileSync("certification/metadata.json", JSON.stringify({sha:process.env.CANDIDATE_SHA, run:Number(process.env.CERTIFICATION_RUN), scope:"technical-only", workflowUrl:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, finalDecision:"pending-manual-index"}, null, 2))'
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CERTIFICATION_RUN: ${{ matrix.run }}

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usability-certification-${{ steps.candidate.outputs.sha }}-run-${{ matrix.run }}
          path: |
            certification/
            playwright-report/usability/
            test-results/
            tmp/master-usability-audit.json
            tmp/playwright-discovery.json
            tmp/usability-test-inventory.json
            tmp/playwright-discovery.txt
            artifacts/playwright/${{ steps.candidate.outputs.sha }}/certification-${{ matrix.run }}/
          if-no-files-found: warn
          retention-days: 90

  cross-browser-essentials:
    name: Essential journeys (${{ matrix.browser }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
      E2E_BROWSER: ${{ matrix.browser }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      E2E_PLAYWRIGHT_TARGET: >-
        e2e/spa/login-owner-patient-ui.spec.ts
        e2e/spa/appointment-flow.spec.ts
        e2e/spa/advanced-care-persistence.spec.ts
        e2e/spa/billing-flow.spec.ts
        e2e/spa/report-registration-exports.spec.ts
        e2e/spa/access-role-matrix-db.spec.ts
        e2e/spa/hospital-personas-routines.spec.ts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify exact candidate identity
        id: candidate
        run: |
          node -e 'const value=process.env.CANDIDATE_SHA; if(!/^[0-9a-f]{40}$/.test(value)){throw new Error("candidate_sha must be a lowercase full SHA")}'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install selected browser
        run: npx playwright install --with-deps "${E2E_BROWSER}"
      - name: Execute essential database-backed journeys
        run: GITHUB_SHA="$CANDIDATE_SHA" bash infra/scripts/run-e2e-spa.sh
      - name: Archive cross-browser evidence
        if: always()
        env:
          E2E_EVIDENCE_RUN_ID: cross-browser-${{ matrix.browser }}
          E2E_ENVIRONMENT: certification-cross-browser
          E2E_INCLUDE_MASTER_AUDIT: '0'
          E2E_EVIDENCE_COMMAND: bash infra/scripts/run-e2e-spa.sh
        run: GITHUB_SHA="$CANDIDATE_SHA" node scripts/archive-playwright-evidence.mjs
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usability-${{ steps.candidate.outputs.sha }}-${{ matrix.browser }}
          path: |
            playwright-report/usability/
            test-results/
            tmp/playwright-discovery.txt
            artifacts/playwright/${{ steps.candidate.outputs.sha }}/cross-browser-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 90

  evidence-index:
    name: Certification evidence index
    if: always()
    needs: [technical-certification, cross-browser-essentials]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify published candidate identity
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node -e 'const value=process.env.CANDIDATE_SHA; if(!/^[0-9a-f]{40}$/.test(value)){throw new Error("candidate_sha must be a lowercase full SHA")}'
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs

      - name: Test manual certification contract
        run: node --test scripts/usability-certification.test.mjs

      - name: Materialize and validate manual evidence
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GO_NO_GO: ${{ inputs.go_no_go_decision }}
          MANUAL_EVIDENCE_JSON: ${{ inputs.manual_evidence_json }}
        run: |
          mkdir -p certification
          node -e 'const fs=require("fs"); const value=process.env.MANUAL_EVIDENCE_JSON; JSON.parse(value); fs.writeFileSync("certification/manual-evidence.json", `${value}\n`)'
          node scripts/validate-usability-manual-evidence.mjs certification/manual-evidence.json "$CANDIDATE_SHA" "$GO_NO_GO"

      - name: Build SHA-bound go/no-go index
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          TECHNICAL_RESULT: ${{ needs.technical-certification.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser-essentials.result }}
          MANUAL_EVIDENCE_PATH: certification/manual-evidence.json
          GO_NO_GO: ${{ inputs.go_no_go_decision }}
        run: node scripts/generate-usability-certification-index.mjs certification/index.md certification/index.json

      - name: Upload certification index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usability-certification-${{ steps.candidate.outputs.sha }}-index
          path: certification/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce a consistent go decision
        if: inputs.go_no_go_decision == 'go'
        run: |
          test "${{ needs.technical-certification.result }}" = "success"
          test "${{ needs.cross-browser-essentials.result }}" = "success"
