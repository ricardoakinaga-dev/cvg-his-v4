name: State of Art Closure

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-of-art-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-tracing-contracts:
    name: Runtime and tracing contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tracing and composition tests import workspace packages through
      # their built `dist` entry points (for example @cvg-his-v2/shared-feature-flags
      # via apps/api/src/feature-flags.ts). A fresh checkout has no dist, so the
      # step failed with ERR_MODULE_NOT_FOUND while passing on developer
      # machines that had built the workspace.
      - name: Build workspace dependencies
        run: pnpm build

      - name: Validate production composition contract
        run: pnpm validate:production-runtime

      - name: Validate observability contract
        run: pnpm validate:observability

      - name: Test production composition contract
        run: pnpm test:production-contract

      - name: Test HTTP tracing propagation and activation
        run: pnpm test:tracing

      - name: Test event catalog integrity
        run: pnpm test:event-catalog

      - name: Test static contract validator
        run: |
          node --test scripts/validate-production-runtime-contract.test.mjs
          node --test scripts/validate-observability-contract.test.mjs
