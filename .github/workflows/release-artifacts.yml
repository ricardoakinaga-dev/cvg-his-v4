name: Release Artifacts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-sha-artifacts:
    name: Publish immutable SHA artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: sha-${{ github.event.workflow_run.head_sha }}
      RELEASE_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker
      SPA_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa
      API_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
      WORKER_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
      SPA_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact CI-tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release governance
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          pnpm docs:validate
          pnpm complexity:check
          pnpm validate:namespaces
          pnpm validate:deploy-surface
          pnpm validate:dependencies
          pnpm validate:production-runtime
          pnpm validate:observability
          pnpm test:production-contract
          pnpm test:tracing
          pnpm test:event-catalog

      - name: Generate source bundle and repository SBOM
        run: |
          mkdir -p artifacts/release
          git archive --format=tar.gz --prefix="cvg-his-v4-${RELEASE_SHA}/" --output="artifacts/release/source-${RELEASE_SHA}.tar.gz" "${RELEASE_SHA}"
          SECURITY_EVIDENCE_DIR=artifacts/release pnpm security:evidence

      - name: Attest candidate security evidence
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: artifacts/release/security-evidence.json

      - name: Verify and record the exact CI run
        env:
          CI_EVIDENCE_OUTPUT_DIR: artifacts/release
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:ci-evidence

      - name: Run pre-publication candidate assurance
        env:
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_PREPUBLICATION: '1'
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          TRIPLE_A_CI_EVIDENCE: artifacts/release/ci-evidence.json
          TRIPLE_A_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIPLE_A_VERIFY_CI_EVIDENCE: '1'
          TRIPLE_A_VERIFY_SECURITY_ATTESTATION: '1'
          TRIPLE_A_RUN_TESTS: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:triple-a

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build API image candidate
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          tags: cvg-his-v4-api:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/api-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build worker image candidate
        id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: cvg-his-v4-worker:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/worker-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build SPA image candidate
        id: spa
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/spa/Dockerfile
          platforms: linux/amd64
          push: false
          tags: cvg-his-v4-spa:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/spa-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Prepare OCI layouts for vulnerability scanning
        run: |
          set -euo pipefail
          for component in api worker spa; do
            layout="/tmp/${component}-image"
            rm -rf "${layout}"
            mkdir -p "${layout}"
            tar -xf "/tmp/${component}-image.tar" -C "${layout}"
            test -f "${layout}/index.json"
            test -f "${layout}/oci-layout"
          done

      - name: Scan API image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/api-image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Scan worker image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/worker-image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Scan SPA image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/spa-image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Install pinned Helm for exact-image runtime validation
        env:
          CVG_HELM_VERSION: v3.15.4
          CVG_HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
          CVG_HELM_IMAGE: alpine/helm@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
          CVG_HELM_BINARY_SHA256: f07f23e8048f704294a670378d5bd36e9f84c1552eb844af82dcd82a17883647
        run: |
          set -euo pipefail
          helm_archive="helm-${CVG_HELM_VERSION#v}-linux-amd64.tar.gz"
          helm_url="https://get.helm.sh/${helm_archive}"
          helm_fallback_url="https://get-helm-front-door-cdn-c9drhfggd8ewfzck.z03.azurefd.net/${helm_archive}"
          if curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${helm_url}" --output "/tmp/${helm_archive}" || \
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${helm_fallback_url}" --output "/tmp/${helm_archive}"; then
            echo "${CVG_HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check -
            tar -xzf "/tmp/${helm_archive}" -C /tmp
            sudo install "/tmp/linux-amd64/helm" /usr/local/bin/helm
          else
            echo "Helm archive endpoints unavailable; using the immutable official Helm image fallback."
            docker pull --quiet "${CVG_HELM_IMAGE}"
            helm_container="$(docker create "${CVG_HELM_IMAGE}")"
            trap 'docker rm --force "${helm_container}" >/dev/null' EXIT
            docker cp "${helm_container}:/usr/bin/helm" /tmp/helm
            echo "${CVG_HELM_BINARY_SHA256}  /tmp/helm" | sha256sum --check -
            sudo install /tmp/helm /usr/local/bin/helm
          fi
          test -x /usr/local/bin/helm
          test "$(command -v helm)" = "/usr/local/bin/helm"
          helm version --short

      - name: Load the exact scanned OCI candidates without rebuilding
        run: |
          set -euo pipefail
          docker load --platform linux/amd64 --input /tmp/api-image.tar
          docker load --platform linux/amd64 --input /tmp/worker-image.tar
          docker load --platform linux/amd64 --input /tmp/spa-image.tar
          docker image inspect "cvg-his-v4-api:${RELEASE_SHA}" >/dev/null
          docker image inspect "cvg-his-v4-worker:${RELEASE_SHA}" >/dev/null
          docker image inspect "cvg-his-v4-spa:${RELEASE_SHA}" >/dev/null

      - name: Start isolated PostgreSQL for exact-image validation
        run: pnpm test:db:start

      - name: Prove the exact OCI candidates at production runtime boundaries
        env:
          RELEASE_IMAGE_MODE: prebuilt
          RELEASE_IMAGE_DATABASE_URL: "${{ format('{0}{1}{2}', 'post', 'gres', '://postgres:postgres@127.0.0.1:5433/cvg_his_v2_release_image_test') }}"
          RELEASE_SOURCE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_API_IMAGE_REF: cvg-his-v4-api:${{ env.RELEASE_SHA }}
          RELEASE_WORKER_IMAGE_REF: cvg-his-v4-worker:${{ env.RELEASE_SHA }}
          RELEASE_SPA_IMAGE_REF: cvg-his-v4-spa:${{ env.RELEASE_SHA }}
          RELEASE_API_OCI_DIGEST: ${{ steps.api.outputs.digest }}
          RELEASE_WORKER_OCI_DIGEST: ${{ steps.worker.outputs.digest }}
          RELEASE_SPA_OCI_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_API_OCI_ARCHIVE: /tmp/api-image.tar
          RELEASE_WORKER_OCI_ARCHIVE: /tmp/worker-image.tar
          RELEASE_SPA_OCI_ARCHIVE: /tmp/spa-image.tar
          RELEASE_IMAGE_EVIDENCE_OUTPUT: artifacts/release/runtime-image-validation.json
        run: pnpm validate:release-images

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish vetted image candidates to quarantine without rebuilding
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/api-image /tmp/worker-image /tmp/spa-image
          tar -xf /tmp/api-image.tar -C /tmp/api-image
          tar -xf /tmp/worker-image.tar -C /tmp/worker-image
          tar -xf /tmp/spa-image.tar -C /tmp/spa-image
          oras copy --recursive --from-oci-layout "/tmp/api-image:${RELEASE_SHA}" "${API_CANDIDATE_IMAGE}"
          oras copy --recursive --from-oci-layout "/tmp/worker-image:${RELEASE_SHA}" "${WORKER_CANDIDATE_IMAGE}"
          oras copy --recursive --from-oci-layout "/tmp/spa-image:${RELEASE_SHA}" "${SPA_CANDIDATE_IMAGE}"
          test "$(oras resolve "${API_CANDIDATE_IMAGE}")" = "${API_DIGEST}"
          test "$(oras resolve "${WORKER_CANDIDATE_IMAGE}")" = "${WORKER_DIGEST}"
          test "$(oras resolve "${SPA_CANDIDATE_IMAGE}")" = "${SPA_DIGEST}"

      - name: Attest API image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest worker image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

      - name: Attest SPA image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa
          subject-digest: ${{ steps.spa.outputs.digest }}
          push-to-registry: true

      - name: Verify image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          SIGNER_WORKFLOW="${GITHUB_REPOSITORY}/.github/workflows/release-artifacts.yml"
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api@${API_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref refs/heads/main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/api-attestation-verification.json
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker@${WORKER_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref refs/heads/main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/worker-attestation-verification.json
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa@${SPA_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref refs/heads/main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/spa-attestation-verification.json

      - name: Generate digest-bound release-set manifest for the gate
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_REQUIRE_IMAGE_DIGESTS: '1'
        run: pnpm release:manifest

      - name: Record image attestation evidence
        env:
          RELEASE_OUTPUT_DIR: artifacts/release
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
          SPA_IMAGE: ${{ env.SPA_IMAGE }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
        run: pnpm release:attestation-evidence

      - name: Run blocking Triple-A release gate
        env:
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          TRIPLE_A_CI_EVIDENCE: artifacts/release/ci-evidence.json
          TRIPLE_A_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIPLE_A_RUN_TESTS: '1'
          TRIPLE_A_IMAGE_ATTESTATION_EVIDENCE: artifacts/release/image-attestation-evidence.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIPLE_A_VERIFY_CI_EVIDENCE: '1'
          TRIPLE_A_VERIFY_ATTESTATIONS: '1'
          TRIPLE_A_VERIFY_SECURITY_ATTESTATION: '1'
        run: pnpm release:triple-a

      # Quarantine tags are pullable implementation details, not release pointers.
      # The three-image release set exists only as the digest-bound manifest artifact,
      # which is generated locally for the gate and uploaded only after that gate passes.
      - name: Generate complete Triple-A evidence package
        env:
          TRIPLE_A_EVIDENCE_PACKAGE_DIR: artifacts/triple-a
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
        run: pnpm evidence:triple-a:package

      - name: Publish certified release manifest and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: |
            artifacts/release/
            artifacts/triple-a/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve failed assurance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-assurance-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: |
            artifacts/release/TRIPLE_A_RELEASE_EVIDENCE.json
            artifacts/release/security-evidence.json
            artifacts/release/sbom.cyclonedx.json
            artifacts/release/ci-evidence.json
          if-no-files-found: warn
          retention-days: 30
