name: Release Artifacts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-sha-artifacts:
    name: Publish immutable SHA artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: sha-${{ github.event.workflow_run.head_sha }}
      RELEASE_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api:${{ github.event.workflow_run.head_sha }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker:${{ github.event.workflow_run.head_sha }}
      SPA_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release governance
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          pnpm docs:validate
          pnpm complexity:check
          pnpm validate:namespaces
          pnpm validate:deploy-surface

      - name: Generate source bundle and repository SBOM
        run: |
          mkdir -p artifacts/release
          git archive --format=tar.gz --prefix="cvg-his-v4-${RELEASE_SHA}/" --output="artifacts/release/source-${RELEASE_SHA}.tar.gz" "${RELEASE_SHA}"
          SECURITY_EVIDENCE_DIR=artifacts/release pnpm security:evidence

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and publish worker image
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.WORKER_IMAGE }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and publish SPA image
        id: spa
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/spa/Dockerfile
          push: true
          tags: ${{ env.SPA_IMAGE }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Generate release manifest and checksums
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_REQUIRE_IMAGE_DIGESTS: '1'
        run: pnpm release:manifest

      - name: Attest API image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest worker image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

      - name: Attest SPA image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa
          subject-digest: ${{ steps.spa.outputs.digest }}
          push-to-registry: true

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
