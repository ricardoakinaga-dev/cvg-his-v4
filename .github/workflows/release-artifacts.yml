name: Release Artifacts

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-sha-artifacts:
    name: Publish immutable SHA artifacts
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: sha-${{ github.event.workflow_run.head_sha }}
      RELEASE_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker
      SPA_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa
      API_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
      WORKER_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
      SPA_CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa:quarantine-${{ github.run_id }}-${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the exact CI-tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release governance
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          pnpm docs:validate
          pnpm complexity:check
          pnpm validate:namespaces
          pnpm validate:deploy-surface
          pnpm validate:dependencies

      - name: Generate source bundle and repository SBOM
        run: |
          mkdir -p artifacts/release
          git archive --format=tar.gz --prefix="cvg-his-v4-${RELEASE_SHA}/" --output="artifacts/release/source-${RELEASE_SHA}.tar.gz" "${RELEASE_SHA}"
          SECURITY_EVIDENCE_DIR=artifacts/release pnpm security:evidence

      - name: Verify and record the exact CI run
        env:
          CI_EVIDENCE_OUTPUT_DIR: artifacts/release
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:ci-evidence

      - name: Run pre-publication candidate assurance
        env:
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_PREPUBLICATION: '1'
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          TRIPLE_A_CI_EVIDENCE: artifacts/release/ci-evidence.json
          TRIPLE_A_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIPLE_A_VERIFY_CI_EVIDENCE: '1'
          TRIPLE_A_RUN_TESTS: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:triple-a

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build API image candidate
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cvg-his-v4-api:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/api-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build worker image candidate
        id: worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: cvg-his-v4-worker:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/worker-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build SPA image candidate
        id: spa
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/spa/Dockerfile
          push: false
          tags: cvg-his-v4-spa:${{ env.RELEASE_SHA }}
          outputs: type=oci,dest=/tmp/spa-image.tar
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          provenance: mode=max
          sbom: true

      - name: Scan API image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/api-image.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Scan worker image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/worker-image.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Scan SPA image candidate for vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          input: /tmp/spa-image.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish vetted image candidates to quarantine without rebuilding
        run: |
          set -euo pipefail
          mkdir -p /tmp/api-image /tmp/worker-image /tmp/spa-image
          tar -xf /tmp/api-image.tar -C /tmp/api-image
          tar -xf /tmp/worker-image.tar -C /tmp/worker-image
          tar -xf /tmp/spa-image.tar -C /tmp/spa-image
          oras copy --recursive --from-oci-layout "/tmp/api-image:${RELEASE_SHA}" "${API_CANDIDATE_IMAGE}"
          oras copy --recursive --from-oci-layout "/tmp/worker-image:${RELEASE_SHA}" "${WORKER_CANDIDATE_IMAGE}"
          oras copy --recursive --from-oci-layout "/tmp/spa-image:${RELEASE_SHA}" "${SPA_CANDIDATE_IMAGE}"

      - name: Attest API image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Attest worker image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true

      - name: Attest SPA image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa
          subject-digest: ${{ steps.spa.outputs.digest }}
          push-to-registry: true

      - name: Verify image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          SIGNER_WORKFLOW="${GITHUB_REPOSITORY}/.github/workflows/release-artifacts.yml"
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-api@${API_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/api-attestation-verification.json
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-worker@${WORKER_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/worker-attestation-verification.json
          gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/cvg-his-v4-spa@${SPA_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${SIGNER_WORKFLOW}" --source-ref main --source-digest "${RELEASE_SHA}" --format json > artifacts/release/spa-attestation-verification.json

      - name: Generate digest-bound release-set manifest for the gate
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
          RELEASE_REQUIRE_IMAGE_DIGESTS: '1'
        run: pnpm release:manifest

      - name: Record image attestation evidence
        env:
          RELEASE_OUTPUT_DIR: artifacts/release
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          API_IMAGE: ${{ env.API_IMAGE }}
          WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
          SPA_IMAGE: ${{ env.SPA_IMAGE }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SPA_DIGEST: ${{ steps.spa.outputs.digest }}
        run: pnpm release:attestation-evidence

      - name: Run blocking Triple-A release gate
        env:
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          TRIPLE_A_CI_EVIDENCE: artifacts/release/ci-evidence.json
          TRIPLE_A_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIPLE_A_RUN_TESTS: '1'
          TRIPLE_A_IMAGE_ATTESTATION_EVIDENCE: artifacts/release/image-attestation-evidence.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIPLE_A_VERIFY_CI_EVIDENCE: '1'
          TRIPLE_A_VERIFY_ATTESTATIONS: '1'
        run: pnpm release:triple-a

      # Quarantine tags are pullable implementation details, not release pointers.
      # The three-image release set exists only as the digest-bound manifest artifact,
      # which is generated locally for the gate and uploaded only after that gate passes.
      - name: Generate complete Triple-A evidence package
        env:
          TRIPLE_A_EVIDENCE_PACKAGE_DIR: artifacts/triple-a
          TRIPLE_A_RELEASE_OUTPUT_DIR: artifacts/release
          TRIPLE_A_EVIDENCE_COMMIT_SHA: ${{ env.RELEASE_SHA }}
        run: pnpm evidence:triple-a:package

      - name: Publish certified release manifest and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: |
            artifacts/release/
            artifacts/triple-a/
          if-no-files-found: error
          retention-days: 90
