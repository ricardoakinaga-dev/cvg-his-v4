          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_EMAIL: admin@cvg-his.local
          E2E_ADMIN_PASSWORD: seed_admin
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          E2E_REDIS_URL: redis://localhost:6380
          E2E_DATABASE_MODE: '1'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
        run: npx playwright test --config playwright-spa.config.ts e2e/spa/visual/visual-regression.spec.ts

      - name: Upload visual regression report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-regression-report
          path: |
            e2e/spa-report/
            playwright-report/usability/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload visual diff screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
            test-results/**/*-expected.png
          retention-days: 14

      - name: Upload visual test-results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 14

  dependency-audit:
    name: Dependency Audit (CVE Scan)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enterprise security evidence
        run: pnpm security:evidence

      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          retention-days: 30

      - name: Publish Audit Report
        if: always()
        run: |
          echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "Security evidence generated in artifact: \`security-evidence\`." >> $GITHUB_STEP_SUMMARY
