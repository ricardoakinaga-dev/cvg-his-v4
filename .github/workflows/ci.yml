  dependency-audit:
    name: Dependency Audit (CVE Scan)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enterprise security evidence
        run: pnpm security:evidence

      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          retention-days: 30

      - name: Publish Audit Report
        if: always()
        run: |
          echo "### Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "Security evidence generated in artifact: \`security-evidence\`." >> $GITHUB_STEP_SUMMARY
