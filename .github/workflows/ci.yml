name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Lint
        run: pnpm lint

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep scan
        run: >-
          semgrep scan
          --config .semgrep.yml
          --config p/security-audit
          --config p/nodejs
          --config p/typescript
          --json-output semgrep.json
          --sarif-output semgrep.sarif
          .

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147 # v3.28.17
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Display Semgrep results
        if: always()
        run: |
          if [ -f semgrep.json ]; then
            echo "### SAST (Semgrep) Results" >> $GITHUB_STEP_SUMMARY
            jq -r '"Total findings: \(.results | length)"' semgrep.json >> $GITHUB_STEP_SUMMARY
            jq -r '"Errors: \([.results[] | select(.extra.severity == "ERROR")] | length) | Warnings: \([.results[] | select(.extra.severity == "WARNING")] | length)"' semgrep.json >> $GITHUB_STEP_SUMMARY
            echo "Full report: https://github.com/$GITHUB_REPOSITORY/security/code-scanning" >> $GITHUB_STEP_SUMMARY
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secret scan
        run: pnpm security:secrets

      - name: Secret scan summary
        if: always()
        run: |
          echo "### Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "Command: \`pnpm security:secrets\`" >> $GITHUB_STEP_SUMMARY

  validate-openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm validate:openapi

  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Install pinned Helm
        env:
          CVG_HELM_VERSION: v3.15.4
          CVG_HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
          CVG_HELM_IMAGE: alpine/helm@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
          CVG_HELM_BINARY_SHA256: f07f23e8048f704294a670378d5bd36e9f84c1552eb844af82dcd82a17883647
        run: |
          set -euo pipefail
          helm_archive="helm-${CVG_HELM_VERSION#v}-linux-amd64.tar.gz"
          helm_url="https://get.helm.sh/${helm_archive}"
          helm_fallback_url="https://get-helm-front-door-cdn-c9drhfggd8ewfzck.z03.azurefd.net/${helm_archive}"
          if curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${helm_url}" --output "/tmp/${helm_archive}" || \
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors "${helm_fallback_url}" --output "/tmp/${helm_archive}"; then
            echo "${CVG_HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check -
            tar -xzf "/tmp/${helm_archive}" -C /tmp
            sudo install "/tmp/linux-amd64/helm" /usr/local/bin/helm
          else
            echo "Helm archive endpoints unavailable; using the immutable official Helm image fallback."
            docker pull --quiet "${CVG_HELM_IMAGE}"
            helm_container="$(docker create "${CVG_HELM_IMAGE}")"
            trap 'docker rm --force "${helm_container}" >/dev/null' EXIT
            docker cp "${helm_container}:/usr/bin/helm" /tmp/helm
            echo "${CVG_HELM_BINARY_SHA256}  /tmp/helm" | sha256sum --check -
            sudo install /tmp/helm /usr/local/bin/helm
          fi
          test -x /usr/local/bin/helm
          test "$(command -v helm)" = "/usr/local/bin/helm"
          helm version --short

      - name: Start isolated PostgreSQL
        run: pnpm test:db:start

      - name: Validate repository source contracts
        run: |
          pnpm validate:openapi
          pnpm validate:namespaces
          pnpm validate:migration-source
          pnpm validate:rls
          pnpm validate:deploy-surface
          pnpm validate:dependencies
          pnpm docs:validate
          pnpm complexity:check

      - name: Validate Helm chart
        run: HELM_BIN=/usr/local/bin/helm REQUIRE_HELM=1 pnpm validate:helm

      - name: Validate deployment and backup contracts
        run: |
          pnpm validate:deploy-surface
          pnpm deploy:check
          pnpm ops:backup:check

      - name: Run install and upgrade drill
        shell: bash
        run: |
          set +e
          INSTALL_UPGRADE_REPORT_DIR=artifacts/operations/install-upgrade pnpm ops:install-upgrade:drill 2>&1 | tee /tmp/install-upgrade-drill.log
          drill_status=${PIPESTATUS[0]}
          if [ "${drill_status}" -ne 0 ] && [ -f artifacts/operations/install-upgrade/install-upgrade-report.json ]; then
            drill_error="$(node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('artifacts/operations/install-upgrade/install-upgrade-report.json','utf8')); process.stdout.write(String(report.error ?? 'unknown drill failure').replace(/\\s+/g, ' '));")"
            echo "::error title=Install and upgrade drill::${drill_error}"
          fi
          exit "${drill_status}"

      - name: Validate static and process contracts
        run: |
          REQUIRE_TEST_DB=1 pnpm vitest run tests/unit/infra/requirement-evidence-matrix.test.ts --config vitest.config.ts
          node --test tests/unit/infra/gauntlet-subcriteria-evidence.test.mjs
          node --test scripts/database-source-resolution.test.mjs
          node --test scripts/database-schema-source-resolution.test.mjs
          node --test scripts/critical-source-manifest.test.mjs
          node --test scripts/build-source-map-contract.test.mjs
          node --test scripts/process-reexport-coverage.test.mjs scripts/source-metric-presence.test.mjs scripts/check-critical-coverage.test.mjs
          pnpm vetus:parity:test

      - name: Validate process runtime contracts
        run: pnpm vitest run tests/integration/process/runtime-lifecycle.test.ts --config vitest.integration.config.ts

      - name: Validate database runtime contracts
        run: |
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/database/migration-integrity-runtime.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/rls/force-rls-catalog.test.ts tests/integration/rls/rls-isolation.test.ts tests/integration/rls/rls-access-governance.test.ts tests/integration/rls/runtime-role-sensitive-acl.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/setup/production-like-runtime-bootstrap.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/database/inpatient-clinical-financial-vertical-http-postgres.test.ts --config vitest.integration.config.ts

      - name: Validate canonical compose configuration
        run: |
          GRAFANA_ADMIN_PASSWORD="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-compose-validation" docker compose --env-file .env.v2.example -f docker-compose.v2.yml config --quiet

      - name: Stop isolated PostgreSQL
        if: always()
        run: pnpm test:db:stop

      - name: Upload install and upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-upgrade-${{ github.sha }}
          path: artifacts/operations/install-upgrade/
          if-no-files-found: error
          retention-days: 30

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Apply migrations
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
        run: pnpm exec tsx packages/db/src/migrate.ts

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          REDIS_URL: redis://localhost:6380
          RUNTIME_DISTRIBUTED_STATE_ENABLED: '1'
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Run API contract tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          API_RUNTIME_URL: http://localhost:3001
        run: pnpm vitest run tests/integration/openapi-runtime.test.ts --config vitest.integration.config.ts

      - name: Run API keys tests
        run: pnpm --filter @cvg-his-v2/module-api-keys run test

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [typecheck, validate-openapi, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Start isolated PostgreSQL
        run: pnpm test:db:start

      - name: Prepare unit-test database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
        run: |
          pnpm exec tsx packages/db/src/migrate.ts
          pnpm exec tsx packages/db/src/seed.ts

      - name: Run unit tests
        run: pnpm test
        env:
          # Declared explicitly: seed accounts (and other test-only affordances)
          # are gated on an explicit development/test environment, never on an
          # unset NODE_ENV.
          NODE_ENV: test
          REQUIRE_TEST_DB: 1
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          TEST_DB_EPHEMERAL: 0

      - name: Run critical process runner contract
        run: pnpm exec vitest run tests/unit/infra/critical-process-suite-contract.test.ts --config vitest.config.ts --no-file-parallelism
        env:
          NODE_ENV: test
          REQUIRE_TEST_DB: 1

      - name: Run CI workflow contract
        run: pnpm exec vitest run tests/unit/infra/ci-contract.test.ts --config vitest.config.ts --no-file-parallelism
        env:
          NODE_ENV: test
          REQUIRE_TEST_DB: 1

      - name: Stop isolated PostgreSQL
        if: always()
        run: pnpm test:db:stop

  critical-process-runner-windows:
    name: Critical Process Runner (Windows contract)
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [build]
    env:
      CRITICAL_PROCESS_ARTIFACT_DIR: critical-process-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "STORE_PATH=$(pnpm store path)"

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows package-manager invocation contract
        run: node --test tests/unit/infra/critical-process-suite-windows-contract.test.mjs

      - name: Validate the Windows runner manifest and dry-run
        env:
          NODE_ENV: test
        run: |
          node infra/scripts/run-critical-process-suite.mjs --list
          node infra/scripts/run-critical-process-suite.mjs --dry-run

      - name: Upload Windows runner diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-process-windows-diagnostics
          path: critical-process-artifacts/**
          if-no-files-found: ignore
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
