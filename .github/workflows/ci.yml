name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  validate-openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm validate:openapi

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [typecheck, validate-openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Run integration tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
        run: pnpm test:critical

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:coverage
        continue-on-error: true

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('fs').readFileSync('coverage/coverage-summary.json','utf8');
              const j = JSON.parse(d);
              const t = j.total;
              console.log('| Metric    | Coverage |');
              console.log('| ----------| -------- |');
              console.log('| Lines     | ' + t.lines.pct + '% |');
              console.log('| Functions | ' + t.functions.pct + '% |');
              console.log('| Branches  | ' + t.branches.pct + '% |');
              console.log('| Statements| ' + t.statements.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report available in artifact" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  test-e2e-spa:
    name: E2E Tests (SPA)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_e2e
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cvg_his_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U postgres -d cvg_his_e2e && break
            sleep 1
          done

      - name: Apply DB schema and seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
        run: |
          if ! node infra/scripts/prepare-test-db.mjs; then
            if ! node infra/scripts/test-critical-bootstrap.mjs; then
              echo "ERROR: DB setup failed - both bootstrap scripts failed"
              exit 1
            fi
          fi

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          REDIS_URL: redis://localhost:6380
          AUTH_SECRET: e2e-ci-secret-key-do-not-use-in-production-12345678
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build &
          wait
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "✅ API is healthy"
              break
            fi
            sleep 2
          done

      - name: Build SPA
        run: pnpm --filter @cvg-his-v2/spa run build

      - name: Start SPA (preview server)
        run: |
          pnpm --filter @cvg-his-v2/spa run preview &
          SPA_PID=$!
          echo "SPA_PID=$SPA_PID" >> $GITHUB_ENV

      - name: Wait for SPA health
        run: |
          echo "⏳ Waiting for SPA to be healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/ >/dev/null 2>&1; then
              echo "✅ SPA is healthy (port 3002)"
              break
            fi
            sleep 2
          done

      - name: Run SPA E2E tests
        env:
          API_URL: http://localhost:3001
          SPA_URL: http://localhost:3002
          E2E_ADMIN_EMAIL: admin@cvg.local
          E2E_ADMIN_PASSWORD: Admin123!
        run: npx playwright test --config playwright-spa.config.ts --grep-invert "Visual"
        continue-on-error: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-spa-report
          path: e2e/spa-report/
          retention-days: 30

  test-visual:
    name: Visual Regression
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
