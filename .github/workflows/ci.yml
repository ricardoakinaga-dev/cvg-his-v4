  dependency-audit:
    name: Dependency Audit (CVE Scan)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run enterprise security evidence
        id: dependency-evidence
        if: always()
        continue-on-error: true
        run: pnpm security:evidence

      - name: Upload security evidence
        id: dependency-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce dependency and SBOM gate
        if: always()
        env:
          EVIDENCE_OUTCOME: ${{ steps.dependency-evidence.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.dependency-artifact.outcome }}
        run: |
          if [ "$EVIDENCE_OUTCOME" != "success" ] || [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "Dependency/SBOM gate failed after evidence collection."
            exit 1
          fi

  image-scan:
    name: Image Scan (${{ matrix.image }})
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [api, spa, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for scanning
        id: image-build
        if: always()
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true
          push: false
          tags: cvg-his-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=image-scan-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-scan-${{ matrix.image }}

      - name: Smoke built image
        id: image-smoke
        if: always()
        continue-on-error: true
        run: |
          node scripts/smoke-container-image.mjs \
            --kind "${{ matrix.image }}" \
            --image "cvg-his-${{ matrix.image }}:${{ github.sha }}"

      - name: Scan image with Trivy
        id: trivy-scan
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cvg-his-${{ matrix.image }}:${{ github.sha }}
          version: v0.72.0
          format: json
          output: artifacts/security/trivy-${{ matrix.image }}.json
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Evaluate image findings
        id: trivy-evaluate
        if: always()
        continue-on-error: true
        env:
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
        run: |
          mkdir -p artifacts/security
          SCANNER_EXIT_CODE=0
          if [ "$TRIVY_SCAN_OUTCOME" != "success" ]; then
            SCANNER_EXIT_CODE=1
          fi
          node scripts/gate-trivy-results.mjs \
            --input artifacts/security/trivy-${{ matrix.image }}.json \
            --report artifacts/security/trivy-${{ matrix.image }}-gate.json \
            --fail-on CRITICAL,HIGH \
            --scanner-exit-code "$SCANNER_EXIT_CODE"

      - name: Upload image scan evidence
        id: trivy-artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.image }}-evidence
          path: artifacts/security/trivy-${{ matrix.image }}*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce image scan gate
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.image-build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.image-smoke.outcome }}
          SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
          EVALUATION_OUTCOME: ${{ steps.trivy-evaluate.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.trivy-artifact.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" != "success" ] || \
             [ "$RUNTIME_OUTCOME" != "success" ] || \
             [ "$SCAN_OUTCOME" != "success" ] || \
             [ "$EVALUATION_OUTCOME" != "success" ] || \
             [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "Image security gate failed after evidence collection."
            exit 1
          fi

  security-gate:
    name: Security Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    if: always()
    needs: [sast, secret-scan, dependency-audit, image-scan]
    steps:
      - name: Enforce all security jobs
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
        run: |
          if [ "$SAST_RESULT" != "success" ] || \
             [ "$SECRET_SCAN_RESULT" != "success" ] || \
             [ "$DEPENDENCY_AUDIT_RESULT" != "success" ] || \
             [ "$IMAGE_SCAN_RESULT" != "success" ]; then
            echo "One or more required security jobs failed."
            exit 1
          fi

  release-gate:
    name: Strict Enterprise Release Gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        security-gate,
        unit-tests,
        integration-tests,
        coverage,
        test-e2e-api,
        test-e2e-spa,
        test-visual
      ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict RC evidence gate
        env:
          RC_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RC_BACKUP_DRILL_REPORT: ${{ vars.RC_BACKUP_DRILL_REPORT }}
          RC_DEPLOY_EVIDENCE_URL: ${{ vars.RC_DEPLOY_EVIDENCE_URL }}
        run: pnpm rc:evidence:strict
