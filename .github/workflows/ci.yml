name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/security-extended
            p/nodejs
            p/typescript
          competitive: false
          on: pushed
          output: semgrep.json
          sarif: semgrep.sarif

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Display Semgrep results
        if: always()
        run: |
          if [ -f semgrep.json ]; then
            echo "### SAST (Semgrep) Results" >> $GITHUB_STEP_SUMMARY
            TOTAL=$(cat semgrep.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const r=JSON.parse(d);console.log(r.results?r.results.length:0)")
            ERRORS=$(cat semgrep.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const r=JSON.parse(d);console.log(r.results?r.results.filter(x=>x.severity==='ERROR').length:0)")
            WARNINGS=$(cat semgrep.json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const r=JSON.parse(d);console.log(r.results?r.results.filter(x=>x.severity==='WARNING').length:0)")
            echo "Total findings: $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "Errors: $ERRORS | Warnings: $WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo "Full report: https://github.com/$GITHUB_REPOSITORY/security/code-scanning" >> $GITHUB_STEP_SUMMARY
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run secret scan
        run: pnpm security:secrets

      - name: Secret scan summary
        if: always()
        run: |
          echo "### Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "Command: \`pnpm security:secrets\`" >> $GITHUB_STEP_SUMMARY

  validate-openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm validate:openapi

  repository-guards:
    name: Repository Guards
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Helm
        env:
          CVG_HELM_VERSION: v3.15.4
          CVG_HELM_SHA256: 11400fecfc07fd6f034863e4e0c4c4445594673fd2a129e701fe41f31170cfa9
        run: |
          set -euo pipefail
          helm_archive="helm-${CVG_HELM_VERSION#v}-linux-amd64.tar.gz"
          helm_url="https://get.helm.sh/${helm_archive}"
          curl --fail --silent --show-error --location "${helm_url}" --output "/tmp/${helm_archive}"
          echo "${CVG_HELM_SHA256}  /tmp/${helm_archive}" | sha256sum --check -
          tar -xzf "/tmp/${helm_archive}" -C /tmp
          sudo install "/tmp/linux-amd64/helm" /usr/local/bin/helm
          test -x /usr/local/bin/helm
          test "$(command -v helm)" = "/usr/local/bin/helm"
          helm version --short

      - name: Start isolated PostgreSQL
        run: pnpm test:db:start

      - name: Validate repository, deployment and recovery contracts
        run: |
          pnpm validate:openapi
          pnpm validate:namespaces
          pnpm validate:migration-source
          pnpm validate:rls
          pnpm validate:deploy-surface
          HELM_BIN=/usr/local/bin/helm REQUIRE_HELM=1 pnpm validate:helm
          pnpm deploy:check
          pnpm ops:backup:check
          REQUIRE_TEST_DB=1 pnpm vitest run tests/unit/infra/requirement-evidence-matrix.test.ts --config vitest.config.ts
          node --test tests/unit/infra/gauntlet-subcriteria-evidence.test.mjs
          pnpm vetus:parity:test
          pnpm vitest run tests/integration/process/runtime-lifecycle.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/database/migration-integrity-runtime.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/rls/force-rls-catalog.test.ts tests/integration/rls/rls-isolation.test.ts tests/integration/rls/rls-access-governance.test.ts tests/integration/rls/runtime-role-sensitive-acl.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/setup/production-like-runtime-bootstrap.test.ts --config vitest.integration.config.ts
          REQUIRE_TEST_DB=1 pnpm vitest run tests/integration/database/inpatient-clinical-financial-vertical-http-postgres.test.ts --config vitest.integration.config.ts
          docker compose --env-file .env.v2.example -f docker-compose.v2.yml config --quiet

      - name: Stop isolated PostgreSQL
        if: always()
        run: pnpm test:db:stop

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Apply migrations
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
        run: pnpm exec tsx packages/db/src/migrate.ts

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          REDIS_URL: redis://localhost:6380
          RUNTIME_DISTRIBUTED_STATE_ENABLED: '1'
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Run API contract tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          API_RUNTIME_URL: http://localhost:3001
        run: pnpm vitest run tests/integration/openapi-runtime.test.ts --config vitest.config.ts

      - name: Run API keys tests
        run: pnpm --filter @cvg-his-v2/module-api-keys run test

  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [typecheck, validate-openapi, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated PostgreSQL
        run: pnpm test:db:start

      - name: Run unit tests
        run: pnpm test
        env:
          # Declared explicitly: seed accounts (and other test-only affordances)
          # are gated on an explicit development/test environment, never on an
          # unset NODE_ENV.
          NODE_ENV: test
          REQUIRE_TEST_DB: 1

      - name: Run critical process runner contract
        run: pnpm exec vitest run tests/unit/infra/critical-process-suite-contract.test.ts --config vitest.config.ts --no-file-parallelism
        env:
          NODE_ENV: test
          REQUIRE_TEST_DB: 1

      - name: Run CI workflow contract
        run: pnpm exec vitest run tests/unit/infra/ci-contract.test.ts --config vitest.config.ts --no-file-parallelism
        env:
          NODE_ENV: test
          REQUIRE_TEST_DB: 1

      - name: Stop isolated PostgreSQL
        if: always()
        run: pnpm test:db:stop

  critical-process-runner-windows:
    name: Critical Process Runner (Windows contract)
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [build]
    env:
      CRITICAL_PROCESS_ARTIFACT_DIR: ${{ runner.temp }}/critical-process-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "STORE_PATH=$(pnpm store path)"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows package-manager invocation contract
        run: node --test tests/unit/infra/critical-process-suite-windows-contract.test.mjs

      - name: Validate the Windows runner manifest and dry-run
        env:
          NODE_ENV: test
        run: |
          node infra/scripts/run-critical-process-suite.mjs --list
          node infra/scripts/run-critical-process-suite.mjs --dry-run

      - name: Upload Windows runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-process-windows-diagnostics
          path: ${{ runner.temp }}/critical-process-artifacts/**
          if-no-files-found: ignore
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Run integration tests
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          REQUIRE_TEST_DB: 1
          TEST_DB_EPHEMERAL: 1
          CRITICAL_PROCESS_TIMEOUT_MS: 600000
          CRITICAL_PROCESS_ARTIFACT_DIR: critical-process-artifacts
        run: pnpm test:critical

      - name: Upload critical process failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-process-artifacts
          path: critical-process-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:coverage

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('fs').readFileSync('coverage/coverage-summary.json','utf8');
              const j = JSON.parse(d);
              const t = j.total;
              console.log('| Metric    | Coverage |');
              console.log('| ----------| -------- |');
              console.log('| Lines     | ' + t.lines.pct + '% |');
              console.log('| Functions | ' + t.functions.pct + '% |');
              console.log('| Branches  | ' + t.branches.pct + '% |');
              console.log('| Statements| ' + t.statements.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report available in artifact" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  performance-k6:
    name: Performance (k6 SLOs)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API
        env:
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PIX_MOCK_MODE: 'true'
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 2
          done

      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar -xz -C /usr/local/bin

      - name: Run k6 benchmark
        id: k6-benchmark
        continue-on-error: true
        env:
          TARGET: http://localhost:3001
          ACCOUNT_ID: acc_cvg_demo
        run: k6 run benchmarks/k6/api-benchmark.js

      - name: Check SLO results
        if: always()
        run: |
          node benchmarks/k6/parse-results.js benchmarks/k6/results/performance-report.json --markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-k6-report
          path: benchmarks/k6/results/performance-report.json
          retention-days: 30

      - name: Fail if k6 thresholds breached
        if: steps.k6-benchmark.outcome == 'failure'
        run: exit 1

  test-e2e-spa:
    name: E2E Tests (SPA)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_e2e
        ports:
          - 5434:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres -d cvg_his_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U postgres -d cvg_his_e2e && break
            sleep 1
          done

      - name: Apply DB schema and seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          ADMIN_EMAIL: admin@cvg-his.local
          ADMIN_PASSWORD: seed_admin
        run: |
          if ! node infra/scripts/prepare-test-db.mjs; then
            if ! node infra/scripts/test-critical-bootstrap.mjs; then
              echo "ERROR: DB setup failed - both bootstrap scripts failed"
              exit 1
            fi
          fi
          pnpm exec tsx packages/db/src/seed.ts

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          REDIS_URL: redis://localhost:6380
          RUNTIME_DISTRIBUTED_STATE_ENABLED: '1'
          AUTH_SECRET: e2e-ci-secret-key-do-not-use-in-production-12345678
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build &
          wait
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null 2>&1; then
              echo "✅ API is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ API did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Build SPA
        run: pnpm --filter @cvg-his-v2/spa run build

      - name: Start SPA (preview server)
        run: |
          pnpm --filter @cvg-his-v2/spa run preview &
          SPA_PID=$!
          echo "SPA_PID=$SPA_PID" >> $GITHUB_ENV

      - name: Wait for SPA health
        run: |
          echo "⏳ Waiting for SPA to be healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/ >/dev/null 2>&1; then
              echo "✅ SPA is healthy (port 3002)"
              break
            fi
            sleep 2
          done

      - name: Run SPA E2E tests
        env:
          API_URL: http://localhost:3001
          SPA_URL: http://localhost:3002
          E2E_ADMIN_EMAIL: admin@cvg-his.local
          E2E_ADMIN_PASSWORD: seed_admin
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          E2E_REDIS_URL: redis://localhost:6380
          E2E_DATABASE_MODE: '1'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
        run: |
          npx playwright test --config playwright-spa.config.ts \
            e2e/spa/master-search-360-reception.spec.ts \
            e2e/spa/master-search-360-mobile.spec.ts \
            e2e/spa/enterprise-surfaces-gate.spec.ts \
            e2e/spa/setup-wizard-accessibility.spec.ts \
            e2e/spa/vetus-import-flow.spec.ts \
            e2e/spa/deleted-sales-report-flow.spec.ts \
            e2e/spa/service-invoices-report-flow.spec.ts

      - name: Generate Enterprise RC evidence
        if: always()
        env:
          RC_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p e2e/spa-report
          pnpm rc:evidence | tee e2e/spa-report/enterprise-rc-evidence.md

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-spa-report
          path: |
            e2e/spa-report/
            test-results/
          retention-days: 30

