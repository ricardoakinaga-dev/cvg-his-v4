          done

      - name: Build SPA
        run: pnpm --filter @cvg-his-v2/spa run build

      - name: Start SPA (preview server)
        run: |
          pnpm --filter @cvg-his-v2/spa run preview &
          SPA_PID=$!
          echo "SPA_PID=$SPA_PID" >> $GITHUB_ENV

      - name: Wait for SPA health
        run: |
          echo "⏳ Waiting for SPA to be healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/ >/dev/null 2>&1; then
              echo "✅ SPA is healthy (port 3002)"
              break
            fi
            sleep 2
          done

      - name: Run visual regression tests
        env:
          API_URL: http://localhost:3001
          SPA_URL: http://localhost:3002
          E2E_ADMIN_EMAIL: admin@cvg.local
          E2E_ADMIN_PASSWORD: Admin123!
        run: npx playwright test --config playwright-spa.config.ts -g "Visual"
        continue-on-error: true

      - name: Upload visual regression report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: e2e/spa-report/
          retention-days: 30

      - name: Upload visual diff screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            e2e/spa/snapshots/**/*.diff.png
            e2e/spa/snapshots/**/*.actual.png
            e2e/spa/snapshots/**/*.expected.png
          retention-days: 14

      - name: Upload visual test-results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 14
