        options: >-
          --health-cmd "pg_isready -U postgres -d cvg_his_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U postgres -d cvg_his_e2e && break
            sleep 1
          done

      - name: Apply DB schema and seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
        run: |
          if ! node infra/scripts/prepare-test-db.mjs; then
            if ! node infra/scripts/test-critical-bootstrap.mjs; then
              echo "ERROR: DB setup failed - both bootstrap scripts failed"
              exit 1
            fi
          fi

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          REDIS_URL: redis://localhost:6380
          AUTH_SECRET: e2e-ci-secret-key-do-not-use-in-production-12345678
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build &
          wait
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
