name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Semgrep scan
        id: semgrep-scan
        continue-on-error: true
        run: |
          mkdir -p artifacts/security
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan \
            --config p/security-audit \
            --config p/nodejs \
            --config p/typescript \
            --json-output artifacts/security/semgrep.json \
            --sarif-output artifacts/security/semgrep.sarif \
            --metrics auto

      - name: Evaluate Semgrep findings
        id: semgrep-evaluate
        if: always()
        continue-on-error: true
        env:
          SEMGREP_SCAN_OUTCOME: ${{ steps.semgrep-scan.outcome }}
        run: |
          SCANNER_EXIT_CODE=0
          if [ "$SEMGREP_SCAN_OUTCOME" != "success" ]; then
            SCANNER_EXIT_CODE=1
          fi
          node scripts/gate-semgrep-results.mjs \
            --input artifacts/security/semgrep.json \
            --report artifacts/security/semgrep-gate.json \
            --fail-on ERROR,WARNING \
            --scanner-exit-code "$SCANNER_EXIT_CODE"

      - name: Upload Semgrep SARIF report
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          sarif_file: artifacts/security/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep evidence
        id: semgrep-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-evidence
          path: artifacts/security/semgrep*
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Semgrep gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep-scan.outcome }}
          EVALUATION_OUTCOME: ${{ steps.semgrep-evaluate.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.semgrep-artifact.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ] || \
             [ "$EVALUATION_OUTCOME" != "success" ] || \
             [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "Semgrep security gate failed after evidence collection."
            exit 1
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan working tree with Secretlint
        id: secretlint
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts/security
          pnpm security:secrets > artifacts/security/secretlint.log 2>&1

      - name: Scan full Git history with Gitleaks
        id: gitleaks-scan
        if: always()
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.27.2@sha256:ebfeb6fd4f2c37fa371d3731ebfa662fdf80f93cd37d3b4771bb82263edff8d0 \
            git /repo \
            --redact \
            --report-format json \
            --report-path /repo/artifacts/security/gitleaks.json \
            --exit-code 0 \
            --log-opts="--all"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.27.2@sha256:ebfeb6fd4f2c37fa371d3731ebfa662fdf80f93cd37d3b4771bb82263edff8d0 \
            dir /repo \
            --redact \
            --report-format json \
            --report-path /repo/artifacts/security/gitleaks-working-tree.json \
            --exit-code 0

      - name: Evaluate Gitleaks findings
        id: gitleaks-evaluate
        if: always()
        continue-on-error: true
        run: |
          node scripts/gate-gitleaks-results.mjs \
            --history artifacts/security/gitleaks.json \
            --working-tree artifacts/security/gitleaks-working-tree.json \
            --baseline .gitleaks-history-baseline.json \
            --report artifacts/security/gitleaks-gate.json

      - name: Upload secret scan evidence
        id: secret-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan-evidence
          path: |
            artifacts/security/secretlint.log
            artifacts/security/gitleaks.json
            artifacts/security/gitleaks-working-tree.json
            artifacts/security/gitleaks-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce secret scan gate
        if: always()
        env:
          SECRETLINT_OUTCOME: ${{ steps.secretlint.outcome }}
          GITLEAKS_SCAN_OUTCOME: ${{ steps.gitleaks-scan.outcome }}
          GITLEAKS_EVALUATION_OUTCOME: ${{ steps.gitleaks-evaluate.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.secret-artifact.outcome }}
        run: |
          if [ "$SECRETLINT_OUTCOME" != "success" ] || \
             [ "$GITLEAKS_SCAN_OUTCOME" != "success" ] || \
             [ "$GITLEAKS_EVALUATION_OUTCOME" != "success" ] || \
             [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "Secret scan gate failed after evidence collection."
            exit 1
          fi

  validate-openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm validate:openapi

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Configure ephemeral database URL
        run: |
          DB_SCHEME=postgres
          TEST_DATABASE_URL="${DB_SCHEME}://postgres:postgres@localhost:5433/cvg_his_v2_test"
          echo "DATABASE_URL=$TEST_DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=$TEST_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: node packages/db/src/migrate.ts

      - name: Start API
        env:
          REDIS_URL: redis://localhost:6380
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 2
          done

      - name: Run API contract tests
        env:
          API_RUNTIME_URL: http://localhost:3001
        run: pnpm vitest run tests/integration/openapi-runtime.test.ts --config vitest.config.ts

      - name: Run API keys tests
        run: pnpm --filter @cvg-his-v2/module-api-keys run test

  build:
    name: Build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    needs: [typecheck, validate-openapi]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5433 -U postgres && break
            sleep 1
          done

      - name: Configure ephemeral database URL
        run: |
          DB_SCHEME=postgres
          TEST_DATABASE_URL="${DB_SCHEME}://postgres:postgres@localhost:5433/cvg_his_v2_test"
          echo "DATABASE_URL=$TEST_DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=$TEST_DATABASE_URL" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: pnpm test:integration

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:coverage

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('fs').readFileSync('coverage/coverage-summary.json','utf8');
              const j = JSON.parse(d);
              const t = j.total;
              console.log('| Metric    | Coverage |');
              console.log('| ----------| -------- |');
              console.log('| Lines     | ' + t.lines.pct + '% |');
              console.log('| Functions | ' + t.functions.pct + '% |');
              console.log('| Branches  | ' + t.branches.pct + '% |');
              console.log('| Statements| ' + t.statements.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report available in artifact" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  performance-k6:
    name: Performance (k6 SLOs)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API
        env:
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PIX_MOCK_MODE: 'true'
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 2
          done

      - name: Install k6
        run: |
          curl -fsSLo /tmp/k6-v0.55.0-linux-amd64.tar.gz \
            https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz
          echo "47a43a8dbb4c1f5d5bd7b8ed6a1b8c83b35546acf989b78400b4e6ce3adaf628  /tmp/k6-v0.55.0-linux-amd64.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/k6-v0.55.0-linux-amd64.tar.gz -C /tmp
          install -m 0755 /tmp/k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6

      - name: Run k6 benchmark
        id: k6-benchmark
        continue-on-error: true
        env:
          TARGET: http://localhost:3001
          ACCOUNT_ID: acc_cvg_demo
        run: k6 run benchmarks/k6/api-benchmark.js

      - name: Check SLO results
        if: always()
        run: |
          node benchmarks/k6/parse-results.js benchmarks/k6/results/performance-report.json --markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-k6-report
