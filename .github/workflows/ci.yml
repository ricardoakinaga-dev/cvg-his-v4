    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_e2e
        ports:
          - 5434:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres -d cvg_his_e2e"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Cache Playwright Chromium
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.58.2-chromium

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5434 -U postgres -d cvg_his_e2e && break
            sleep 1
          done

      - name: Apply DB schema and seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          ADMIN_EMAIL: admin@cvg-his.local
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: seed_admin
          RECEPTION_EMAIL: reception@cvg-his.local
          RECEPTION_USERNAME: reception
          RECEPTION_PASSWORD: seed_reception
          VETERINARIAN_EMAIL: vet@cvg-his.local
          VETERINARIAN_USERNAME: vet
          VETERINARIAN_PASSWORD: seed_vet
          SECOND_ADMIN_EMAIL: admin-b@cvg-his.local
          SECOND_ADMIN_USERNAME: admin_b
          SECOND_ADMIN_PASSWORD: seed_admin_b
          SECOND_TENANT_SLUG: e2e-secondary
          SECOND_ACCOUNT_SLUG: e2e-secondary
          SECOND_UNIT_CODE: hq
        run: |
          if ! node infra/scripts/prepare-test-db.mjs; then
            if ! node infra/scripts/test-critical-bootstrap.mjs; then
              echo "ERROR: DB setup failed - both bootstrap scripts failed"
              exit 1
            fi
          fi
          pnpm exec tsx packages/db/src/seed.ts

      - name: Start API
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          REDIS_URL: redis://localhost:6380
          RUNTIME_DISTRIBUTED_STATE_ENABLED: '1'
          AUTH_SECRET: e2e-ci-secret-key-do-not-use-in-production-12345678
          # The full browser gate runs 419 serial tests and exercises the real
          # login/refresh flow. Keep a finite CI-only budget large enough for
          # that suite without changing the production default of 10.
          AUTH_RATE_LIMIT_MAX_REQUESTS: '2000'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
          PORT: '3001'
          NODE_ENV: test
        run: |
          pnpm --filter @cvg-his-v2/api run build &
          wait
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null 2>&1; then
              echo "✅ API is healthy"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ API did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Build SPA
        run: pnpm --filter @cvg-his-v2/spa run build

      - name: Start SPA (preview server)
        run: |
          pnpm --filter @cvg-his-v2/spa run preview &
          SPA_PID=$!
          echo "SPA_PID=$SPA_PID" >> $GITHUB_ENV

      - name: Wait for SPA health
        run: |
          echo "⏳ Waiting for SPA to be healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/ >/dev/null 2>&1; then
              echo "✅ SPA is healthy (port 3002)"
              break
            fi
            sleep 2
          done

      - name: Run SPA E2E tests
        env:
          API_URL: http://localhost:3001
          SPA_URL: http://localhost:3002
          E2E_ADMIN_EMAIL: admin@cvg-his.local
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: seed_admin
          E2E_RECEPTION_EMAIL: reception@cvg-his.local
          E2E_RECEPTION_USERNAME: reception
          E2E_RECEPTION_PASSWORD: seed_reception
          E2E_VETERINARIAN_EMAIL: vet@cvg-his.local
          E2E_VETERINARIAN_USERNAME: vet
          E2E_VETERINARIAN_PASSWORD: seed_vet
          E2E_SECOND_ADMIN_EMAIL: admin-b@cvg-his.local
          E2E_SECOND_ADMIN_USERNAME: admin_b
          E2E_SECOND_ADMIN_PASSWORD: seed_admin_b
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          E2E_REDIS_URL: redis://localhost:6380
          E2E_DATABASE_MODE: '1'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
          E2E_ENVIRONMENT: ci-postgresql
          E2E_AUDIT_COMMAND: npx playwright test --config playwright-spa.config.ts
        run: |
          mkdir -p tmp
          node scripts/prepare-usability-evidence-run.mjs
          npx playwright test --config playwright-spa.config.ts --list | tee tmp/playwright-discovery.txt
          node scripts/generate-usability-test-inventory.mjs
          export E2E_INVENTORY_DIGEST="$(node -e 'process.stdout.write(require("./tmp/usability-test-inventory.json").digest)')"
          npx playwright test --config playwright-spa.config.ts

      - name: Run canonical clinical API E2E
        if: always()
        env:
          API_URL: http://localhost:3001
          BASE_URL: http://localhost:3001
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: seed_admin
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5434/cvg_his_e2e
          E2E_REDIS_URL: redis://localhost:6380
          E2E_DATABASE_MODE: '1'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
          REQUIRE_TEST_DB: '1'
        run: npx playwright test --config playwright.config.ts e2e/tests/jornada-clinica-canonica.spec.ts

      - name: Validate complete usability evidence
        if: always()
        run: node scripts/validate-usability-playwright-evidence.mjs

      - name: Archive SHA-bound usability evidence
        if: always()
        env:
          E2E_EVIDENCE_RUN_ID: ci-${{ github.run_id }}
          E2E_ENVIRONMENT: ci-postgresql
          E2E_EVIDENCE_COMMAND: npx playwright test --config playwright-spa.config.ts
        run: node scripts/archive-playwright-evidence.mjs

      - name: Generate Enterprise RC evidence
        if: always()
        env:
          RC_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          mkdir -p e2e/spa-report
          pnpm rc:evidence | tee e2e/spa-report/enterprise-rc-evidence.md

      - name: Upload E2E report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-spa-${{ github.sha }}
          path: |
            e2e/spa-report/
            e2e/report/
            playwright-report/usability/
            test-results/
            tmp/master-usability-audit.json
            tmp/playwright-discovery.txt
            tmp/playwright-discovery.json
            tmp/usability-test-inventory.json
            artifacts/playwright/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 30

