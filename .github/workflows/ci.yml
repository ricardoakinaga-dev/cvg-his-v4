  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify clean checkout
        run: node scripts/assert-clean-checkout.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Run coverage
        run: pnpm test:coverage

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('fs').readFileSync('coverage/coverage-summary.json','utf8');
              const j = JSON.parse(d);
              const t = j.total;
              console.log('| Metric    | Coverage |');
              console.log('| ----------| -------- |');
              console.log('| Lines     | ' + t.lines.pct + '% |');
              console.log('| Functions | ' + t.functions.pct + '% |');
              console.log('| Branches  | ' + t.branches.pct + '% |');
              console.log('| Statements| ' + t.statements.pct + '% |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report available in artifact" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  performance-k6:
    name: Performance (k6 SLOs)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvg_his_v2_test
        ports:
          - 5433:5432
        options: >-
          --shm-size 1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm build

      - name: Prepare performance database and deterministic tenant
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
        run: |
          pnpm exec tsx packages/db/src/migrate.ts
          pnpm exec tsx packages/db/src/seed.ts
          pnpm benchmark:k6:seed

      - name: Start API
        env:
          AUTH_SECRET: ci-test-secret-key-do-not-use-in-production-123456789012
          PIX_MOCK_MODE: 'true'
          PORT: '3001'
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5433/cvg_his_v2_test
          REDIS_URL: redis://localhost:6380
          RUNTIME_DISTRIBUTED_STATE_ENABLED: '1'
          API_DISABLE_INCOMPATIBLE_DB_REPOS: '0'
          # The frozen 60-VU profile must not serialize requests behind the
          # default 20-connection pool. Keep the CI capacity model explicit
          # and below PostgreSQL's default max_connections.
          POSTGRES_MAX_CONNECTIONS: '60'
          POSTGRES_POOL_MIN: '8'
        run: |
          pnpm --filter @cvg-his-v2/api run build
          pnpm --filter @cvg-his-v2/api run dev &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ready >/dev/null 2>&1; then
              echo "API is ready with its required dependencies"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "API did not become ready for the performance gate" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Install pinned k6
        env:
          K6_VERSION: v0.55.0
          K6_SHA256: 47a43a8dbb4c1f5d5bd7b8ed6a1b8c83b35546acf989b78400b4e6ce3adaf628
        run: |
          set -euo pipefail
          archive="k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/grafana/k6/releases/download/${K6_VERSION}/${archive}" --output "/tmp/${archive}"
          echo "${K6_SHA256}  /tmp/${archive}" | sha256sum --check -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          test "$(command -v k6)" = "/usr/local/bin/k6"
          k6 version

      - name: Run k6 benchmark
        id: k6-benchmark
        env:
          TARGET: http://localhost:3001
          LOAD_PROFILE: operational-minimum-v1
        run: |
          mkdir -p benchmarks/k6/results
          k6 run benchmarks/k6/api-benchmark.js

      - name: Check SLO results
        if: always()
        run: |
          node benchmarks/k6/parse-results.js benchmarks/k6/results/performance-report.json --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-k6-report
          path: benchmarks/k6/results/performance-report.json
          retention-days: 30

  test-e2e-spa:
    name: E2E Tests (SPA)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: [build]
    env:
