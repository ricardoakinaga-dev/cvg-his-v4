name: Security Operations Certification

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA from main to certify
        required: true
        type: string
      target_environment:
        description: Environment where rotation and break-glass were exercised
        required: true
        type: choice
        options: [staging, production]
      secret_classes:
        description: Secret classes exercised; names only, never values
        required: true
        type: string
      previous_version_label:
        description: Previous non-secret version label
        required: true
        type: string
      current_version_label:
        description: Current non-secret version label
        required: true
        type: string
      rotation_evidence_reference:
        description: Immutable ticket or evidence-package reference for the rotation drill
        required: true
        type: string
      break_glass_evidence_reference:
        description: Immutable ticket or evidence-package reference for the break-glass drill
        required: true
        type: string
      vault_audit_evidence_reference:
        description: Restricted Vault audit-log reference; never paste audit contents here
        required: true
        type: string
      executors:
        description: Corporate identities of the drill executors
        required: true
        type: string
      approvers:
        description: Security and Operations approvers
        required: true
        type: string
      residual_risks:
        description: Accepted residual risks, or a descriptive statement that none remain
        required: true
        type: string
      go_no_go_decision:
        description: Security and Operations decision
        required: true
        type: choice
        options: [go, no-go]

permissions:
  contents: read

concurrency:
  group: security-operations-${{ inputs.release_sha }}-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  certify:
    name: Rotation and break-glass evidence gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: security-operations
    steps:
      - name: Validate requested SHA
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: printf '%s' "${REQUESTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Ensure candidate belongs to main
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REQUESTED_SHA}"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${REQUESTED_SHA}" origin/main
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Run repository secret scan, dependency audit and SBOM generation
        run: pnpm security:evidence

      - name: Verify dual-key rotation and Vault fail-closed contracts
        run: |
          pnpm exec tsx --test apps/api/src/startup-secrets.test.ts
          pnpm --filter @cvg-his-v2/secrets test
          pnpm exec vitest run tests/unit/api/startup-secrets-runtime.test.ts --config vitest.config.ts --no-file-parallelism

      - name: Generate SHA-bound security operations index
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          SECRET_CLASSES: ${{ inputs.secret_classes }}
          PREVIOUS_VERSION_LABEL: ${{ inputs.previous_version_label }}
          CURRENT_VERSION_LABEL: ${{ inputs.current_version_label }}
          ROTATION_EVIDENCE_REFERENCE: ${{ inputs.rotation_evidence_reference }}
          BREAK_GLASS_EVIDENCE_REFERENCE: ${{ inputs.break_glass_evidence_reference }}
          VAULT_AUDIT_EVIDENCE_REFERENCE: ${{ inputs.vault_audit_evidence_reference }}
          EXECUTORS: ${{ inputs.executors }}
          APPROVERS: ${{ inputs.approvers }}
          RESIDUAL_RISKS: ${{ inputs.residual_risks }}
          TECHNICAL_RESULT: success
          GO_NO_GO: ${{ inputs.go_no_go_decision }}
        run: pnpm security:operations:index

      - name: Upload immutable evidence index, SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-operations-${{ inputs.release_sha }}-${{ inputs.target_environment }}
          path: |
            certification/security-operations.*
            artifacts/security/
          if-no-files-found: error
          retention-days: 90
