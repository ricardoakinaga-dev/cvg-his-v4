version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvg_his
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - cvg_his_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cvg_his']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - cvg_his_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  cvg-his-api:
    build:
      context: .
      dockerfile: apps/his-api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 80
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cvg_his
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: cvg-his
      JWT_SECRET: change-me
      JWT_ISSUER: cvg-his
      JWT_AUDIENCE: cvg-his-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  cvg-his-worker:
    build:
      context: .
      dockerfile: apps/his-worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cvg_his
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: cvg-his
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cvg-his-api:
        condition: service_healthy

volumes:
  cvg_his_postgres_data:
  cvg_his_redis_data:
