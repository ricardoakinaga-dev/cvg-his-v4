apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cvg-his-v2-worker.fullname" . }}
  labels:
    app: {{ include "cvg-his-v2-worker.fullname" . }}
    app.kubernetes.io/name: {{ include "cvg-his-v2-worker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cvg-his-v2-worker.fullname" . }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: {{ .Values.podAnnotations.prometheus_io_scrape | quote }}
        prometheus.io/port: {{ .Values.podAnnotations.prometheus_io_port | quote }}
      labels:
        app: {{ include "cvg-his-v2-worker.fullname" . }}
        app.kubernetes.io/name: {{ include "cvg-his-v2-worker.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cvg-his-v2-worker.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h ${DATABASE_HOST:-postgres} -p ${DATABASE_PORT:-5432} -U ${DATABASE_USER:-cvghis}; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready"
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cvg-his-v2-worker.fullname" . }}-config
                  key: DATABASE_HOST
                  optional: true
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cvg-his-v2-worker.fullname" . }}-config
                  key: DATABASE_PORT
                  optional: true
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvg-his-v2-worker.fullname" . }}-secret
                  key: DATABASE_USER
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until nc -z ${REDIS_HOST:-redis} ${REDIS_PORT:-6379}; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready"
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cvg-his-v2-worker.fullname" . }}-config
                  key: REDIS_HOST
                  optional: true
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cvg-his-v2-worker.fullname" . }}-config
                  key: REDIS_PORT
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
