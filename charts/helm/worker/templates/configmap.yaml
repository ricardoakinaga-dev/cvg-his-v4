apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cvg-his-v2-worker.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "cvg-his-v2-worker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  NODE_ENV: "production"
  FF_RUNTIME_DISTRIBUTED_STATE_ENABLED: "true"
  WORKER_CONCURRENCY: "5"
  WORKER_JOB_TIMEOUT_MS: "300000"
