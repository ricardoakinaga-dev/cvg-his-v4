apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvg-his-v2-worker.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "cvg-his-v2-worker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_USER: "cvghis"
  DATABASE_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://cvghis:REPLACE_ME@postgres:5432/cvghis"
  REDIS_URL: "redis://default:REPLACE_ME@redis:6379"
