apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cvg-his-v2-api.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "cvg-his-v2-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  NODE_ENV: "production"
  FF_RUNTIME_DISTRIBUTED_STATE_ENABLED: "true"
  FF_AUTH_RATE_LIMIT_ENABLED: "true"
  AUTH_RATE_LIMIT_WINDOW_MS: "900000"
  AUTH_RATE_LIMIT_MAX_REQUESTS: "100"
  AUTH_RATE_LIMIT_BLOCK_DURATION_MS: "300000"
