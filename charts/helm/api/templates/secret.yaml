apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cvg-his-v2-api.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "cvg-his-v2-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DATABASE_USER: "cvghis"
  # Populated via ExternalSecrets or vault-injector at runtime
  DATABASE_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://cvghis:REPLACE_ME@postgres:5432/cvghis"
  REDIS_URL: "redis://default:REPLACE_ME@redis:6379"
  PAGARME_API_KEY: "REPLACE_ME"
  PAGARME_PIX_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"
