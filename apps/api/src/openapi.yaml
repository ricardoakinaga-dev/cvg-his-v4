components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from /auth/login.
        Include as: Authorization: Bearer <token>
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key issued by the /api-keys endpoint for third-party access.

  parameters:
    FeatureFlagKey:
      in: path
      name: key
      required: true
      schema:
        type: string
      description: Canonical feature flag key.

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Field 'email' must be a valid email address
        details:
          type: object
          additionalProperties: true
          description: Additional error context
        correlationId:
          type: string
          format: uuid
          description: Request correlation ID for tracing

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: cvg-his-api
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: production
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        liveness:
          type: object
          properties:
            live:
              type: boolean
            initialized:
              type: boolean
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            productionReady:
              type: boolean
            persistenceMode:
              type: string
              enum: [in-memory, database]
        dependencies:
          type: object

    LivenessResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
        version:
          type: string

    CreateFeatureFlagRequest:
      type: object
      required: [key, owner, description, defaultValue]
      properties:
        key:
          type: string
        owner:
          type: string
        description:
          type: string
        defaultValue:
          type: boolean
