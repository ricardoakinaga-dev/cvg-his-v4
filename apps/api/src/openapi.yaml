  /cep/lookup:
    get:
      operationId: cepLookup
      summary: CEP address lookup
      description: |
        Looks up Brazilian CEP (postal code) using ViaCEP service.
        Returns address components: street, district, city, state, IBGE code.
      tags: [Utilities]
      security: []
      parameters:
        - name: cep
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}-?\d{3}$'
          description: Brazilian CEP (postal code)
      responses:
        '200':
          description: Address found
          content:
            application/json:
              schema:
                type: object
                properties:
                  cep:
                    type: string
                  street:
                    type: string
                  complement:
                    type: string
                  district:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  ibge:
                    type: string
                  found:
                    type: boolean
        '404':
          description: CEP not found
        '502':
          description: ViaCEP service unavailable

