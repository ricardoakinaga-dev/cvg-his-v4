components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from /auth/login.
        Include as: Authorization: Bearer <token>
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key issued by the /api-keys endpoint for third-party access.

  parameters:
    FeatureFlagKey:
      in: path
      name: key
      required: true
      schema:
        type: string
      description: Canonical feature flag key.

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Field 'email' must be a valid email address
        details:
          type: object
          additionalProperties: true
          description: Additional error context
        correlationId:
          type: string
          format: uuid
          description: Request correlation ID for tracing

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: cvg-his-api
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: production
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        liveness:
          type: object
          properties:
            live:
              type: boolean
            initialized:
              type: boolean
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            productionReady:
              type: boolean
            persistenceMode:
              type: string
              enum: [in-memory, database]
        dependencies:
          type: object

    LivenessResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
        version:
          type: string

    SloReportResponse:
      type: object
      required: [generatedAt, configs, snapshot, report, runbook]
      properties:
        generatedAt:
          type: string
          format: date-time
        configs:
          type: array
          items:
            $ref: '#/components/schemas/SloConfig'
        snapshot:
          $ref: '#/components/schemas/SloSnapshot'
        report:
          $ref: '#/components/schemas/SloComplianceReport'
        runbook:
          type: object
          required: [metrics, readiness, liveness]
          properties:
            metrics:
              type: string
              example: /metrics
            readiness:
              type: string
              example: /ready
            liveness:
              type: string
              example: /live

    SloConfig:
      type: object
      required: [id, name, target, unit, window, alertThreshold, criticalThreshold, category]
      properties:
        id:
          type: string
          example: api-availability
        name:
          type: string
          example: API Availability
        target:
          type: number
          example: 99.5
        unit:
          type: string
          example: percent
        window:
          type: string
          example: 1h
        alertThreshold:
          type: number
          example: 99
        criticalThreshold:
          type: number
          example: 98
        category:
          type: string
          enum: [performance, availability, reliability]

    SloSnapshot:
      type: object
      required:
        - generatedAt
        - latencyWindowMinutes
        - availabilityWindowMinutes
        - requestCount5m
        - requestCount1h
        - p95LatencyMs
        - p99LatencyMs
        - availabilityPercent
        - errorRatePercent
      properties:
        generatedAt:
          type: string
          format: date-time
        latencyWindowMinutes:
          type: integer
          example: 5
        availabilityWindowMinutes:
          type: integer
          example: 60
        requestCount5m:
          type: integer
          example: 120
        requestCount1h:
          type: integer
          example: 1440
        p95LatencyMs:
          type: number
          example: 128.4
        p99LatencyMs:
          type: number
          example: 244.1
        availabilityPercent:
          type: number
          example: 99.95
        errorRatePercent:
          type: number
          example: 0.04

    SloComplianceReport:
      type: object
      required: [generatedAt, window, slos, overallStatus, errorBudgetExhausted]
      properties:
        generatedAt:
          type: string
          format: date-time
        window:
          type: string
          example: 30d
        overallStatus:
          type: string
          enum: [healthy, degraded, critical]
        errorBudgetExhausted:
          type: boolean
        slos:
          type: array
          items:
            $ref: '#/components/schemas/SloStatus'

    SloStatus:
      type: object
      required:
        - id
        - name
        - category
        - currentValue
        - target
        - unit
        - status
        - errorBudgetPercent
        - burnRate
        - lastUpdated
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [performance, availability, reliability]
        currentValue:
          type: number
        target:
          type: number
        unit:
          type: string
        status:
          type: string
          enum: [healthy, alert, critical]
        errorBudgetPercent:
          type: number
        burnRate:
          type: number
        lastUpdated:
          type: string
          format: date-time

    CreateFeatureFlagRequest:
      type: object
      required: [key, owner, description, defaultValue]
      properties:
        key:
          type: string
        owner:
          type: string
        description:
          type: string
        defaultValue:
          type: boolean
        scopes:
          type: array
          items:
            type: string
            enum: [global, environment, tenant, account, user]
        expiresAt:
          type: string
          format: date-time
        auditRequired:
          type: boolean
        tags:
          type: array
          items:
            type: string

    UpdateFeatureFlagRequest:
      allOf:
        - $ref: '#/components/schemas/CreateFeatureFlagRequest'

    UpsertFeatureFlagOverrideRequest:
      type: object
      required: [enabled]
      properties:
        environment:
          type: string
        accountIdOverride:
          type: string
        userId:
          type: string
        percentage:
          type: number
          nullable: true
        allowedUsers:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    FeatureFlagDefinition:
      type: object
      properties:
        key:
          type: string
        owner:
          type: string
        description:
          type: string
        defaultValue:
          type: boolean
        scopes:
          type: array
          items:
            type: string
            enum: [global, environment, tenant, account, user]
        expiresAt:
          type: string
          format: date-time
          nullable: true
        auditRequired:
          type: boolean
        tags:
          type: array
          items:
            type: string

    FeatureFlagDecision:
      type: object
      properties:
        enabled:
          type: boolean
        reason:
          type: string
        provider:
          type: string

    FeatureFlagOverride:
      type: object
      properties:
        environment:
          type: string
          nullable: true
        accountIdOverride:
          type: string
          nullable: true
        userId:
          type: string
          nullable: true
        percentage:
          type: number
          nullable: true
        allowedUsers:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    FeatureFlagRolloutSummary:
      type: object
      properties:
        totalOverrides:
          type: integer
        enabledOverrides:
          type: integer
        percentageRollouts:
          type: array
          items:
            type: number
        targetedUsers:
          type: integer
        targetedAccounts:
          type: integer
        targetedEnvironments:
          type: array
          items:
            type: string

    FeatureFlagOperationalReport:
      type: object
      properties:
        key:
          type: string
        owner:
          type: string
        description:
          type: string
        defaultValue:
          type: boolean
        auditRequired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lifecycleStatus:
          type: string
          enum: [active, expired, expiring_soon, permanent]
        tags:
          type: array
          items:
            type: string
        currentDecision:
          $ref: '#/components/schemas/FeatureFlagDecision'
        rolloutSummary:
          $ref: '#/components/schemas/FeatureFlagRolloutSummary'
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagOverride'

    FeatureFlagListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagDefinition'
        total:
          type: integer

    FeatureFlagOverrideListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagOverride'
        total:
          type: integer

    FeatureFlagOperationalReportListResponse:
      type: object
      properties:
        environment:
          type: string
        generatedAt:
          type: string
          format: date-time
        summary:
          type: object
          properties:
            totalFlags:
              type: integer
            auditRequiredFlags:
              type: integer
            expiredFlags:
              type: integer
            expiringSoonFlags:
              type: integer
            enabledForCurrentContext:
              type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagOperationalReport'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or email address
          example: operator@example.com
        password:
          type: string
          format: password
          example: '**********'

    LoginResponse:
      type: object
      required: [accessToken, tokenType, principal]
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
          enum: [Bearer]
        principal:
          type: object
          description: Authenticated principal associated with the access token
          properties:
            user:
              $ref: '#/components/schemas/User'
            session:
              $ref: '#/components/schemas/Session'
