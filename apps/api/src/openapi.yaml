openapi: 3.0.3
info:
  title: CVG HIS API
  version: '1.0.0'
  description: |
    CVG Hospital Information System REST API.

    ## Authentication
    All protected endpoints require a Bearer token in the Authorization header:
    `Authorization: Bearer <access_token>`

    ## Common Headers
    - `x-correlation-id`: Optional correlation ID for request tracing (auto-generated if not provided)
    - `x-tenant-id`: Multi-tenant account identifier (default: system account)
    - `x-branch-id`: Optional branch/facility identifier

    ## Error Response Format
    All error responses follow a consistent structure:
    ```json
    {
      "code": "ERROR_CODE",
      "message": "Human-readable message",
      "details": {},
      "correlationId": "uuid"
    }
    ```

    ## HTTP Status Codes
    - `200` OK - Request succeeded
    - `201` Created - Resource created successfully
    - `204` No Content - Request succeeded with no response body
    - `400` Bad Request - Validation error or malformed request
    - `401` Unauthorized - Authentication required or token expired/invalid
    - `403` Forbidden - Insufficient permissions for this operation
    - `404` Not Found - Resource does not exist
    - `409` Conflict - Resource conflict (e.g., duplicate entry)
    - `502` Bad Gateway - External service unavailable
    - `503` Service Unavailable - API is not ready to receive traffic
    - `500` Internal Server Error - Unexpected server error

    ## Rate Limiting
    Rate limiting is applied per account. Clients should respect `X-RateLimit-*` headers.

    ## Pagination
    List endpoints use cursor-based or offset pagination via `page` and `pageSize` query parameters.

    ## Correlation
    Every response includes the `x-correlation-id` header matching the request (or generated if not provided).
  contact:
    name: CVG HIS Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.his.cvg.com
    description: Production API

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Health checks and monitoring endpoints
  - name: Authentication
    description: Login, logout, session management
  - name: MFA
    description: Multi-factor authentication
  - name: LGPD
    description: LGPD consent and data subject requests
  - name: Owners
    description: Owner/tutor management
  - name: Patients
    description: Patient/animal management
  - name: Encounters
    description: Clinical encounters
  - name: Appointments
    description: Appointment scheduling
  - name: Queue
    description: Operational queue management
  - name: Medical Records
    description: Clinical notes and attachments
  - name: Inpatient
    description: Inpatient management and bed allocation
  - name: Triage
    description: Triage classification
  - name: Preventive
    description: Vaccines and dewormers preventive events
  - name: Billing
    description: Billing and financial records
  - name: Financial
    description: Financial operations, receivables, reconciliation and admin controls
  - name: Inventory
    description: Inventory and stock management
  - name: Commercial
    description: Packages, loyalty, price table and point-of-sale synchronization operations
  - name: Counter Sales
    description: Counter sale/comanda operations, payments and commercial dashboard
  - name: Notifications
    description: Notification management
  - name: Webhooks
    description: Webhook subscription management for external integrations
  - name: API Keys
    description: API key lifecycle for third-party access
  - name: Integrations
    description: Premium integration catalog and contract surface
  - name: Payments
    description: Safe payment intent and provider abstraction endpoints
  - name: Feature Flags
    description: Feature flag catalog, rollout overrides and operational governance
  - name: Access Control
    description: Roles, permissions and team management
  - name: Audit
    description: Audit trail and event logs
  - name: Staff
    description: Staff member management
  - name: Commissions
    description: Commission rules, calculations, review and payment lifecycle
  - name: Reports
    description: Enterprise report catalog, execution, export and scheduling
  - name: Marketing
    description: Campaigns, segments and communication templates
  - name: Products
    description: Product catalog
  - name: Quotes
    description: Service quotes and estimates
  - name: Prescriptions
    description: Medication prescriptions and executions
  - name: Diagnostics
    description: Diagnostic orders, released results and exam catalog bridge
  - name: Laboratory
    description: Laboratory operations, report types, equipment and reference values
  - name: ML
    description: Applied intelligence endpoints for OCR, forecasting and anomaly detection
  - name: Discharges
    description: Patient discharge management
  - name: Fiscal
    description: Fiscal tables, NFS-e documents and operational backoffice
  - name: Utilities
    description: Utility endpoints for master search and address lookup

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns full system health status including database connectivity,
        repository state, worker status, and initialization state.
        Use this for comprehensive monitoring.
      tags: [Health]
      security: []
      responses:
        '200':
          description: System is healthy
          headers:
            x-correlation-id:
              schema:
                type: string
              description: Correlation ID for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Simple liveness check. Returns 200 if the Node.js process is running.
        Does not check database or external dependencies.
        Use for Kubernetes liveness probes.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Health readiness (alias)
      description: Alias for `/ready`. Returns whether the API is ready to receive traffic.
      tags: [Health]
      security: []
      responses:
        '200':
          description: API is ready
        '503':
          description: API is not ready

  /health/live:
    get:
      operationId: getHealthLive
      summary: Health liveness (alias)
      description: Alias for `/live`. Returns whether the Node.js process is alive.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is alive

  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns whether the API is ready to receive traffic.
        Checks initialization state and production readiness flags.
        Use for Kubernetes readiness probes and load balancer health checks.
      tags: [Health]
      security: []
      responses:
        '200':
          description: API is ready to receive traffic
        '503':
          description: API is not ready (initializing or degraded)

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Returns application metrics in Prometheus exposition format.
        Includes HTTP request counts, latency histograms, error rates,
        active requests, database health, and default Node.js VM metrics.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",route="/health",status_code="200"} 42

  /slos:
    get:
      operationId: getSloReport
      summary: SLO compliance report
      description: |
        Returns the current API SLO snapshot, compliance report, error budget,
        burn rate and runbook links. Use this endpoint for executive operation
        dashboards and incident readiness reviews.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Current SLO report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloReportResponse'

  /health/slos:
    get:
      operationId: getHealthSloReport
      summary: Health SLO report alias
      description: Alias for `/slos`.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Current SLO report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SloReportResponse'

  /flags:
    get:
      operationId: listFeatureFlags
      summary: List feature flags
      description: Returns the operational feature flag catalog for the authenticated account.
      tags: [Feature Flags]
      responses:
        '200':
          description: Feature flags listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagListResponse'
    post:
      operationId: createFeatureFlag
      summary: Create feature flag
      tags: [Feature Flags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlagRequest'
      responses:
        '201':
          description: Feature flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDefinition'

  /flags/report:
    get:
      operationId: listFeatureFlagOperationalReport
      summary: List feature flag operational report
      description: Returns rollout, lifecycle and current decision summary for all flags in the current account.
      tags: [Feature Flags]
      parameters:
        - in: query
          name: environment
          schema:
            type: string
          description: Evaluation environment, defaults to `development`.
        - in: query
          name: userId
          schema:
            type: string
          description: Optional user override for evaluation context.
      responses:
        '200':
          description: Operational report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagOperationalReportListResponse'

  /flags/{key}:
    get:
      operationId: getFeatureFlag
      summary: Get feature flag
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
      responses:
        '200':
          description: Feature flag found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDefinition'
        '404':
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateFeatureFlag
      summary: Update feature flag
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureFlagRequest'
      responses:
        '200':
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDefinition'
    delete:
      operationId: disableFeatureFlag
      summary: Disable feature flag
      description: Applies a disabling override for the selected environment.
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
        - in: query
          name: environment
          schema:
            type: string
          description: Optional target environment for the disabling override.
      responses:
        '204':
          description: Feature flag disabled

  /flags/{key}/evaluate:
    get:
      operationId: evaluateFeatureFlag
      summary: Evaluate feature flag
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
        - in: query
          name: environment
          schema:
            type: string
          description: Evaluation environment, defaults to `development`.
        - in: query
          name: userId
          schema:
            type: string
          description: Optional user override for evaluation context.
      responses:
        '200':
          description: Feature flag decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagDecision'

  /flags/{key}/overrides:
    get:
      operationId: listFeatureFlagOverrides
      summary: List feature flag overrides
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
      responses:
        '200':
          description: Feature flag overrides listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagOverrideListResponse'
    post:
      operationId: upsertFeatureFlagOverride
      summary: Upsert feature flag override
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFeatureFlagOverrideRequest'
      responses:
        '200':
          description: Feature flag override persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  flagKey:
                    type: string

  /flags/{key}/report:
    get:
      operationId: getFeatureFlagOperationalReport
      summary: Get feature flag operational report
      tags: [Feature Flags]
      parameters:
        - $ref: '#/components/parameters/FeatureFlagKey'
        - in: query
          name: environment
          schema:
            type: string
          description: Evaluation environment, defaults to `development`.
        - in: query
          name: userId
          schema:
            type: string
          description: Optional user override for evaluation context.
      responses:
        '200':
          description: Operational report generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagOperationalReport'
        '404':
          description: Feature flag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/setup/status:
    get:
      operationId: authSetupStatus
      summary: Report whether first-run setup is pending
      description: |
        Reports whether the installation still needs its initial super
        administrator. Public so the SPA can route a fresh install to the setup
        wizard instead of a login form that cannot succeed.
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: Installation state
          content:
            application/json:
              schema:
                type: object
                required: [setupRequired, setupAvailable]
                properties:
                  setupRequired:
                    type: boolean
                  setupAvailable:
                    type: boolean
                    description: Whether an operator bootstrap secret is configured and setup mutation is enabled.
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Installation state cannot be determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/setup:
    post:
      operationId: authSetupProvision
      summary: Provision the initial clinic and super administrator
      description: |
        Creates the tenant, account, unit, role catalog and the first super
        administrator, then requires authentication through the normal login
        flow on any API replica.

        Only works before the durable installation sentinel is completed and
        requires the explicitly configured SETUP_BOOTSTRAP_TOKEN. No credential
        is generated or logged when configuration is absent. Rejected with 409
        once the installation has been provisioned.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, clinicName, adminUsername, adminEmail, adminPassword]
              properties:
                token:
                  type: string
                  minLength: 43
                  description: Bootstrap token that authorizes first-run setup.
                clinicName:
                  type: string
                  maxLength: 255
                adminUsername:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]{3,128}$'
                adminFullName:
                  type: string
                  maxLength: 255
                adminEmail:
                  type: string
                  format: email
                adminPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
            example:
              token: replace-with-64-character-random-hex-bootstrap-secret-generated-offline
              clinicName: Clínica Veterinária Central
              adminUsername: admin
              adminFullName: Maria Silva
              adminEmail: admin@clinica.com.br
              adminPassword: SenhaForte2026!
      responses:
        '201':
          description: Installation provisioned; authenticate through the normal login flow
          content:
            application/json:
              schema:
                type: object
                required: [setupCompleted, requiresLogin]
                properties:
                  setupCompleted:
                    type: boolean
                    enum: [true]
                  requiresLogin:
                    type: boolean
                    enum: [true]
        '400':
          description: Invalid payload or weak administrator password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid bootstrap token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Installation has already been provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Setup payload exceeds the supported body limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Installation transaction failed before completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Setup is disabled or installation state cannot be determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate user
      description: |
        Authenticates a user with username/email and password.
        Returns access token (JWT) and refresh token on success.
        Access tokens expire according to server configuration.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: operator@example.com
              password: examplepassword
      responses:
        '200':
          description: Authentication successful
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access token
      description: |
        Exchanges the HttpOnly refresh cookie for a rotated access token.
        A refreshToken body field is accepted only for non-browser legacy clients.
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token invalid or expired

  /auth/logout:
    post:
      operationId: authLogout
      summary: Logout user
      description: |
        Invalidates the current session and clears the HttpOnly refresh cookie.
        A refreshToken body field is accepted only for non-browser legacy clients.
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional refresh token to invalidate
      responses:
        '204':
          description: Logged out successfully

  /auth/session:
    get:
      operationId: getSession
      summary: Get current session
      description: |
        Returns the current authenticated user's session data,
        permissions, and principal information.
      tags: [Authentication]
      responses:
        '200':
          description: Current session data
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  access:
                    $ref: '#/components/schemas/AccessInfo'
                  principal:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      session:
                        $ref: '#/components/schemas/Session'
                      access:
                        $ref: '#/components/schemas/AccessInfo'
        '401':
          description: Not authenticated

  /auth/login/mfa:
    post:
      operationId: authMfaComplete
      summary: Complete MFA login
      description: |
        Completes a login flow after MFA challenge.
        Called after initial /auth/login returns MFA_REQUIRED status.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, token]
              properties:
                userId:
                  type: string
                  format: uuid
                token:
                  type: string
                  description: TOTP code from authenticator app
                challengeId:
                  type: string
                  description: Opaque challenge returned by the password login step
      responses:
        '200':
          description: MFA verified, login complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/mfa/enroll:
    post:
      operationId: authMfaEnroll
      summary: Start required MFA enrollment
      tags: [Authentication, MFA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              properties:
                challengeId:
                  type: string
      responses:
        '200':
          description: TOTP enrollment initialized after password verification
        '401':
          description: Login challenge is invalid or expired
        '409':
          description: MFA is already active

  /auth/mfa/enroll/confirm:
    post:
      operationId: authMfaEnrollConfirm
      summary: Confirm required MFA enrollment and complete login
      tags: [Authentication, MFA]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, token]
              properties:
                challengeId:
                  type: string
                token:
                  type: string
      responses:
        '200':
          description: MFA enrollment confirmed and login completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Login challenge or TOTP is invalid

  /mfa/setup:
    post:
      operationId: mfaSetup
      summary: Initialize MFA setup
      description: |
        Generates a new MFA TOTP secret for the authenticated user.
        Returns the secret URI (for QR code) and manual entry key.
      tags: [MFA]
      responses:
        '200':
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  uri:
                    type: string
                    description: otpauth:// URI for QR code
        '501':
          description: MFA not configured on server
        '401':
          description: Not authenticated

  /mfa/setup/confirm:
    post:
      operationId: mfaConfirmSetup
      summary: Confirm MFA setup
      description: |
        Confirms MFA setup by validating a TOTP code.
        After confirmation, MFA is active for the account.
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: TOTP code to validate setup
      responses:
        '200':
          description: MFA confirmed and active
          content:
            application/json:
              schema:
                type: object
                properties:
                  isActive:
                    type: boolean
        '401':
          description: Invalid TOTP code

  /mfa/status:
    get:
      operationId: mfaStatus
      summary: Get MFA status
      description: |
        Returns whether MFA is active and required for the current user.
      tags: [MFA]
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isActive:
                    type: boolean
                  isRequired:
                    type: boolean

  /mfa/disable:
    post:
      operationId: mfaDisable
      summary: Disable MFA
      description: |
        Disables MFA for the current user account.
        Requires a valid TOTP code to confirm disablement.
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /mfa/recovery-codes/regenerate:
    post:
      operationId: mfaRegenerateRecoveryCodes
      summary: Regenerate MFA recovery codes
      description: |
        Generates a new set of recovery codes for the authenticated user.
        Invalidates all previous recovery codes.
      tags: [MFA]
      responses:
        '200':
          description: New recovery codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string

  /lgpd/consent:
    get:
      operationId: lgpdGetConsents
      summary: List consents
      description: |
        Returns all LGPD consents for a given subject.
        Supports filtering by subject type and active status.
      tags: [LGPD]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Subject ID (owner, patient, or user)
        - name: subjectType
          in: query
          required: true
          schema:
            type: string
            enum: [owner, patient, user]
          description: Type of subject
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Return only active consents
      responses:
        '200':
          description: List of consents
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '400':
          description: Missing required parameters

    post:
      operationId: lgpdGrantConsent
      summary: Grant consent
      description: Records a new LGPD consent for a subject.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Consent recorded

