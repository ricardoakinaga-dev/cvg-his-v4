      summary: CEP address lookup
      description: |
        Looks up Brazilian CEP (postal code) using ViaCEP service.
        Returns address components: street, district, city, state, IBGE code.
      tags: [Utilities]
      security: []
      parameters:
        - name: cep
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{5}-?\d{3}$'
          description: Brazilian CEP (postal code)
      responses:
        '200':
          description: Address found
          content:
            application/json:
              schema:
                type: object
                properties:
                  cep:
                    type: string
                  street:
                    type: string
                  complement:
                    type: string
                  district:
                    type: string
                  city:
                    type: string
                  state:
                    type: string
                  ibge:
                    type: string
                  found:
                    type: boolean
        '404':
          description: CEP not found
        '502':
          description: ViaCEP service unavailable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from /auth/login.
        Include as: Authorization: Bearer <token>
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key issued by the /api-keys endpoint for third-party access.

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error message
          example: Field 'email' must be a valid email address
        details:
          type: object
          additionalProperties: true
          description: Additional error context
        correlationId:
          type: string
          format: uuid
          description: Request correlation ID for tracing

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: cvg-his-api
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          example: production
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
        liveness:
          type: object
          properties:
            live:
              type: boolean
            initialized:
              type: boolean
        readiness:
          type: object
          properties:
            ready:
              type: boolean
            productionReady:
              type: boolean
            persistenceMode:
              type: string
              enum: [in-memory, database]
        dependencies:
          type: object

    LivenessResponse:
      type: object
      properties:
        ok:
          type: boolean
