openapi: 3.0.3
info:
  title: CVG HIS API
  version: '1.0.0'
  description: |
    CVG Hospital Information System REST API.

    ## Authentication
    All protected endpoints require a Bearer token in the Authorization header:
    `Authorization: Bearer <access_token>`

    ## Common Headers
    - `x-correlation-id`: Optional correlation ID for request tracing (auto-generated if not provided)
    - `x-tenant-id`: Multi-tenant account identifier (default: system account)
    - `x-branch-id`: Optional branch/facility identifier

    ## Error Response Format
    All error responses follow a consistent structure:
    ```json
    {
      "code": "ERROR_CODE",
      "message": "Human-readable message",
      "details": {},
      "correlationId": "uuid"
    }
    ```

    ## HTTP Status Codes
    - `200` OK - Request succeeded
    - `201` Created - Resource created successfully
    - `204` No Content - Request succeeded with no response body
    - `400` Bad Request - Validation error or malformed request
    - `401` Unauthorized - Authentication required or token expired/invalid
    - `403` Forbidden - Insufficient permissions for this operation
    - `404` Not Found - Resource does not exist
    - `409` Conflict - Resource conflict (e.g., duplicate entry)
    - `502` Bad Gateway - External service unavailable
    - `503` Service Unavailable - API is not ready to receive traffic
    - `500` Internal Server Error - Unexpected server error

    ## Rate Limiting
    Rate limiting is applied per account. Clients should respect `X-RateLimit-*` headers.

    ## Pagination
    List endpoints use cursor-based or offset pagination via `page` and `pageSize` query parameters.

    ## Correlation
    Every response includes the `x-correlation-id` header matching the request (or generated if not provided).
  contact:
    name: CVG HIS Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.his.cvg.com
    description: Production API

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Health checks and monitoring endpoints
  - name: Authentication
    description: Login, logout, session management
  - name: MFA
    description: Multi-factor authentication
  - name: LGPD
    description: LGPD consent and data subject requests
  - name: Owners
    description: Owner/tutor management
  - name: Patients
    description: Patient/animal management
  - name: Encounters
    description: Clinical encounters
  - name: Appointments
    description: Appointment scheduling
  - name: Queue
    description: Operational queue management
  - name: Medical Records
    description: Clinical notes and attachments
  - name: Inpatient
    description: Inpatient management and bed allocation
  - name: Triage
    description: Triage classification
  - name: Billing
    description: Billing and financial records
  - name: Inventory
    description: Inventory and stock management
  - name: Notifications
    description: Notification management
  - name: Webhooks
    description: Webhook subscription management for external integrations
  - name: API Keys
    description: API key lifecycle for third-party access
  - name: Integrations
    description: Premium integration catalog and contract surface
  - name: Payments
    description: Safe payment intent and provider abstraction endpoints
  - name: Access Control
    description: Roles, permissions and team management
  - name: Audit
    description: Audit trail and event logs
  - name: Staff
    description: Staff member management
  - name: Products
    description: Product catalog
  - name: Quotes
    description: Service quotes and estimates
  - name: Prescriptions
    description: Medication prescriptions and executions
  - name: Discharges
    description: Patient discharge management
  - name: Utilities
    description: Utility endpoints for master search and address lookup

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns full system health status including database connectivity,
        repository state, worker status, and initialization state.
        Use this for comprehensive monitoring.
      tags: [Health]
      security: []
      responses:
        '200':
          description: System is healthy
          headers:
            x-correlation-id:
              schema:
                type: string
              description: Correlation ID for this request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Simple liveness check. Returns 200 if the Node.js process is running.
        Does not check database or external dependencies.
        Use for Kubernetes liveness probes.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/ready:
    get:
      operationId: getHealthReady
      summary: Health readiness (alias)
      description: Alias for `/ready`. Returns whether the API is ready to receive traffic.
      tags: [Health]
      security: []
      responses:
        '200':
          description: API is ready
        '503':
          description: API is not ready

  /health/live:
    get:
      operationId: getHealthLive
      summary: Health liveness (alias)
      description: Alias for `/live`. Returns whether the Node.js process is alive.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Process is alive

  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns whether the API is ready to receive traffic.
        Checks initialization state and production readiness flags.
        Use for Kubernetes readiness probes and load balancer health checks.
      tags: [Health]
      security: []
      responses:
        '200':
          description: API is ready to receive traffic
        '503':
          description: API is not ready (initializing or degraded)

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Returns application metrics in Prometheus exposition format.
        Includes HTTP request counts, latency histograms, error rates,
        active requests, database health, and default Node.js VM metrics.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",route="/health",status_code="200"} 42

  /auth/login:
    post:
      operationId: authLogin
      summary: Authenticate user
      description: |
        Authenticates a user with username/email and password.
        Returns access token (JWT) and refresh token on success.
        Access tokens expire according to server configuration.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin@cvg.com
              password: mypassword123
      responses:
        '200':
          description: Authentication successful
          headers:
            x-correlation-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh access token
      description: |
        Exchanges a valid refresh token for a new access token.
        The refresh token is not invalidated until a new login occurs.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token invalid or expired

  /auth/logout:
    post:
      operationId: authLogout
      summary: Logout user
      description: |
        Invalidates the current session. If a refresh token is provided,
        it is also invalidated server-side.
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional refresh token to invalidate
      responses:
        '204':
          description: Logged out successfully

  /auth/session:
    get:
      operationId: getSession
      summary: Get current session
      description: |
        Returns the current authenticated user's session data,
        permissions, and principal information.
      tags: [Authentication]
      responses:
        '200':
          description: Current session data
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  access:
                    $ref: '#/components/schemas/AccessInfo'
                  principal:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      session:
                        $ref: '#/components/schemas/Session'
                      access:
                        $ref: '#/components/schemas/AccessInfo'
        '401':
          description: Not authenticated

  /auth/login/mfa:
    post:
      operationId: authMfaComplete
      summary: Complete MFA login
      description: |
        Completes a login flow after MFA challenge.
        Called after initial /auth/login returns MFA_REQUIRED status.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, token]
              properties:
                userId:
                  type: string
                  format: uuid
                token:
                  type: string
                  description: TOTP code from authenticator app
      responses:
        '200':
          description: MFA verified, login complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /mfa/setup:
    post:
      operationId: mfaSetup
      summary: Initialize MFA setup
      description: |
        Generates a new MFA TOTP secret for the authenticated user.
        Returns the secret URI (for QR code) and manual entry key.
      tags: [MFA]
      responses:
        '200':
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  uri:
                    type: string
                    description: otpauth:// URI for QR code
        '501':
          description: MFA not configured on server
        '401':
          description: Not authenticated

  /mfa/setup/confirm:
    post:
      operationId: mfaConfirmSetup
      summary: Confirm MFA setup
      description: |
        Confirms MFA setup by validating a TOTP code.
        After confirmation, MFA is active for the account.
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: TOTP code to validate setup
      responses:
        '200':
          description: MFA confirmed and active
          content:
            application/json:
              schema:
                type: object
                properties:
                  isActive:
                    type: boolean
        '401':
          description: Invalid TOTP code

  /mfa/status:
    get:
      operationId: mfaStatus
      summary: Get MFA status
      description: |
        Returns whether MFA is active and required for the current user.
      tags: [MFA]
      responses:
        '200':
          description: MFA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isActive:
                    type: boolean
                  isRequired:
                    type: boolean

  /mfa/disable:
    post:
      operationId: mfaDisable
      summary: Disable MFA
      description: |
        Disables MFA for the current user account.
        Requires a valid TOTP code to confirm disablement.
      tags: [MFA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /mfa/recovery-codes/regenerate:
    post:
      operationId: mfaRegenerateRecoveryCodes
      summary: Regenerate MFA recovery codes
      description: |
        Generates a new set of recovery codes for the authenticated user.
        Invalidates all previous recovery codes.
      tags: [MFA]
      responses:
        '200':
          description: New recovery codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string

  /lgpd/consent:
    get:
      operationId: lgpdGetConsents
      summary: List consents
      description: |
        Returns all LGPD consents for a given subject.
        Supports filtering by subject type and active status.
      tags: [LGPD]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Subject ID (owner, patient, or user)
        - name: subjectType
          in: query
          required: true
          schema:
            type: string
            enum: [owner, patient, user]
          description: Type of subject
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Return only active consents
      responses:
        '200':
          description: List of consents
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRecord'
        '400':
          description: Missing required parameters

    post:
      operationId: lgpdGrantConsent
      summary: Grant consent
      description: Records a new LGPD consent for a subject.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Consent recorded

  /lgpd/consent/revoke:
    post:
      operationId: lgpdRevokeConsent
      summary: Revoke consent
      description: Revokes an existing LGPD consent.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRevokeRequest'
      responses:
        '200':
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'

  /lgpd/consent/status:
    get:
      operationId: lgpdGetConsentStatus
      summary: Get consent status
      description: |
        Returns the active status for all defined consent purposes
        (marketing, analytics, clinical, financial, operational, notifications)
        for a given subject.
      tags: [LGPD]
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
        - name: subjectType
          in: query
          required: true
          schema:
            type: string
            enum: [owner, patient, user]
      responses:
        '200':
          description: Consent status by purpose
          content:
            application/json:
              schema:
                type: object
                properties:
                  subjectId:
                    type: string
                  subjectType:
                    type: string
                  active:
                    type: object
                    additionalProperties:
                      type: boolean

  /lgpd/requests:
    get:
      operationId: lgpdListRequests
      summary: List DSR requests
      description: |
        Lists LGPD Data Subject Requests (DSR) for the current account.
        Supports filtering by subject or status.
      tags: [LGPD]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: string
            format: uuid
        - name: subjectType
          in: query
          schema:
            type: string
            enum: [owner, patient, user]
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of DSR requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/DsrRequest'

    post:
      operationId: lgpdCreateRequest
      summary: Create DSR request
      description: Creates a new LGPD Data Subject Request (access, deletion, portability).
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DsrCreateRequest'
      responses:
        '201':
          description: DSR created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DsrRequest'

  /lgpd/requests/complete:
    post:
      operationId: lgpdCompleteRequest
      summary: Complete DSR request
      description: Marks a DSR request as completed with optional result data.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
                  format: uuid
                resultJson:
                  type: object
                  description: JSON result data to attach to the request
      responses:
        '200':
          description: DSR completed

  /lgpd/requests/reject:
    post:
      operationId: lgpdRejectRequest
      summary: Reject DSR request
      description: Rejects an LGPD Data Subject Request.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  description: Reason for rejection
      responses:
        '200':
          description: DSR rejected

  /lgpd/export:
    post:
      operationId: lgpdExportData
      summary: Export personal data
      description: |
        Builds a complete export of all personal data for a given subject.
        Aggregates data from multiple domain services.
      tags: [LGPD]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, subjectType]
              properties:
                subjectId:
                  type: string
                  format: uuid
                subjectType:
                  type: string
                  enum: [owner, patient, user]
                dataProviders:
                  type: object
                  additionalProperties: {}
                  description: Optional data providers to include
      responses:
        '200':
          description: Personal data export

  /master-search:
    get:
      operationId: masterSearch
      summary: Master registry search
      description: |
        Searches across the master patient registry.
        Returns matched patients with their owner information.
      tags: [Utilities]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (name, document, etc.)
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object

  /owners:
    get:
      operationId: listOwners
      summary: List owners
      description: Returns a list of all owners/tutors in the account.
      tags: [Owners]
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search by name or document
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: List of owners
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwners'

    post:
      operationId: createOwner
      summary: Create owner
      description: Creates a new owner/tutor record.
      tags: [Owners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerRequest'
      responses:
        '201':
          description: Owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'

  /owners/{ownerId}:
    get:
      operationId: getOwner
      summary: Get owner by ID
      description: Returns a single owner by their ID.
      tags: [Owners]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Owner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          description: Owner not found

    patch:
      operationId: updateOwner
      summary: Update owner
      description: Updates an existing owner record. All fields are optional.
      tags: [Owners]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOwnerRequest'
      responses:
        '200':
          description: Owner updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'

  /owner-patient-links:
    get:
      operationId: listOwnerPatientLinks
      summary: List owner-patient links
      description: Returns owner-patient relationships for linking owners to patients.
      tags: [Owners]
      parameters:
        - name: ownerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by owner ID
        - name: patientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by patient ID
      responses:
        '200':
          description: Owner-patient links
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object

    post:
      operationId: createOwnerPatientLink
      summary: Create owner-patient link
      description: Links an owner to a patient.
      tags: [Owners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, patientId]
              properties:
                ownerId:
                  type: string
                  format: uuid
                patientId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                type: object

  /patients:
    get:
      operationId: listPatients
      summary: List patients
      description: Returns a list of all patients (animals) in the account.
      tags: [Patients]
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of patients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatients'

    post:
      operationId: createPatient
      summary: Create patient
      description: Creates a new patient (animal) record.
      tags: [Patients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

  /patients/{patientId}:
    get:
      operationId: getPatient
      summary: Get patient by ID
      tags: [Patients]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

    patch:
      operationId: updatePatient
      summary: Update patient
      tags: [Patients]
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Patient updated

  /encounters:
    get:
      operationId: listEncounters
      summary: List encounters
      description: Returns all clinical encounters for the account.
      tags: [Encounters]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of encounters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Encounter'

    post:
      operationId: createEncounter
      summary: Open encounter
      description: Opens a new clinical encounter for a patient.
      tags: [Encounters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEncounterRequest'
      responses:
        '201':
          description: Encounter opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'

  /encounters/{encounterId}:
    get:
      operationId: getEncounter
      summary: Get encounter by ID
      tags: [Encounters]
      parameters:
        - name: encounterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Encounter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'

  /encounters/{encounterId}/timeline:
    get:
      operationId: getEncounterTimeline
      summary: Get encounter timeline
      description: Returns the clinical timeline events for an encounter.
