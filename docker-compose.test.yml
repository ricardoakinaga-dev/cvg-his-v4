# Docker Compose for test database.
# Used by the test suite to provide an isolated PostgreSQL instance.
# Does NOT interfere with dev or production environments.

services:
  postgres-test:
    image: postgres:16-alpine
    restart: 'no'
    # The monorepo starts several isolated databases concurrently. PostgreSQL
    # uses shared memory for lock/table state; Docker's 64 MiB default caused
    # real migrations to fail with ENOSPC and could crash the test server.
    shm_size: '1gb'
    environment:
      POSTGRES_DB: cvg_his_v2_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cvg_his_v2_test']
      interval: 3s
      timeout: 3s
      retries: 15
